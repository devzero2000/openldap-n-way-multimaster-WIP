# ==============================================================================
# TITOLO:       Configurazione Cluster OpenLDAP Multi-Master dinamico a N-vie
# AUTORE:       Elia Pinto
# DATA:         Luglio 2026
# SCOPO:        Deploy corazzato con mTLS SASL/EXTERNAL nativo, PPolicy e ACL mirate
# ==============================================================================

---
- name: Configurazione Cluster OpenLDAP Multi-Master dinamico (N-Way) - HARDENED SASL EXTERNAL mTLS
  hosts: cluster
  become: true
  vars:
    ldap_basedn: "dc=example,dc=com"
    ldap_rootdn: "cn=admin,dc=example,dc=com"
    ldap_rootpw: "openldap"

    ldap_admin_group: "cn=administrators,ou=groups,dc=example,dc=com"

    # Dinamico: la CA e il nodo coordinatore coincidono sempre con il primo host dell'inventory del gruppo cluster
    ca_server: "{{ groups['cluster'][0] }}"
    cluster_nodes: "{{ groups['cluster'] }}"

    # Variabili infrastruttura PKI / SSL
    ssl_ca_path: "/etc/ldap/sasl2/ca.crt"
    ssl_cert_path: "/etc/ldap/sasl2/ldap-server.crt"
    ssl_key_path: "/etc/ldap/sasl2/ldap-server.key"

  tasks:
    # =========================================================================
    # FASE PRELIMINARE: GENERAZIONE E DISTRIBUZIONE CERTIFICATI SSL/TLS
    # =========================================================================

    - name: Certificati - Installa openssl sulla CA
      ansible.builtin.apt:
        name: openssl
        state: present
      when: inventory_hostname == ca_server

    - name: Certificati - Directory temporanea locale sul control node
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: /tmp/ldap_certs_transit
        state: directory
        mode: "0700"
      run_once: true

    - name: Certificati - Generazione Autorità di Certificazione (Solo sul primo nodo)
      when: inventory_hostname == ca_server
      block:
        - name: CA - Genera chiave privata
          ansible.builtin.command: openssl genrsa -out /tmp/ca.key 4096
          args:
            creates: /tmp/ca.key
          changed_when: true

        - name: CA - Genera certificato root
          ansible.builtin.command: >
            openssl req -x509 -new -nodes -key /tmp/ca.key -sha256 -days 3650
            -subj "/C=IT/ST=Lazio/L=Rome/O=Cyber Actors/CN=Cyber Actors Local CA"
            -out /tmp/ca.crt
          args:
            creates: /tmp/ca.crt
          changed_when: true

    - name: Server Cert - Genera chiave per ciascun nodo del cluster
      ansible.builtin.command: "openssl genrsa -out /tmp/{{ item }}.key 2048"
      args:
        creates: "/tmp/{{ item }}.key"
      with_items: "{{ cluster_nodes }}"
      when: inventory_hostname == ca_server
      changed_when: true

    - name: Server Cert - Genera estensioni SAN dinamiche per ciascun nodo
      ansible.builtin.copy:
        dest: "/tmp/{{ item }}.ext"
        mode: "0600"
        content: |
          authorityKeyIdentifier=keyid,issuer
          basicConstraints=CA:FALSE
          keyUsage = digitalSignature, nonRepudiation, keyEncipherment, dataEncipherment
          subjectAltName = @alt_names
          [alt_names]
          DNS.1 = {{ item }}
          DNS.2 = {{ item | split('.') | first }}
          DNS.3 = localhost
          IP.1 = {{ hostvars[item]['ansible_default_ipv4']['address'] | default('127.0.0.1') }}
          IP.2 = 127.0.0.1
      with_items: "{{ cluster_nodes }}"
      when: inventory_hostname == ca_server

    - name: Server Cert - Genera CSR per ciascun nodo del cluster
      ansible.builtin.command: >
        openssl req -new -key /tmp/{{ item }}.key  -subj "/C=IT/ST=Lazio/L=Rome/O=Cyber Actors/CN={{ item }}"
        -out /tmp/{{ item }}.csr
      args:
        creates: "/tmp/{{ item }}.csr"
      with_items: "{{ cluster_nodes }}"
      when: inventory_hostname == ca_server
      changed_when: true

    - name: Server Cert - Firma certificato per ciascun nodo usando la CA locale
      ansible.builtin.command: >
        openssl x509 -req -in /tmp/{{ item }}.csr -CA /tmp/ca.crt -CAkey /tmp/ca.key
        -CAcreateserial -out /tmp/{{ item }}.crt -days 1825 -sha256 -extfile /tmp/{{ item }}.ext
      args:
        creates: "/tmp/{{ item }}.crt"
      with_items: "{{ cluster_nodes }}"
      when: inventory_hostname == ca_server
      changed_when: true

    - name: Certificati - Fetch dinamico verso il Control Node di tutti i certificati
      ansible.builtin.fetch:
        src: "/tmp/{{ item }}"
        dest: "/tmp/ldap_certs_transit/{{ item }}"
        flat: true
      with_items:
        - "ca.crt"
        - "{{ cluster_nodes | map('regex_replace', '$', '.key') | list }}"
        - "{{ cluster_nodes | map('regex_replace', '$', '.crt') | list }}"
      loop_control:
        extended: true
      when: inventory_hostname == ca_server

    - name: Certificati - Distribuzione e assegnazione permessi restrittivi (Hardened)
      ansible.builtin.copy:
        src: "/tmp/ldap_certs_transit/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: openldap
        group: openldap
        mode: "{{ item.mode }}"
      with_items:
        - { src: "ca.crt", dest: "{{ ssl_ca_path }}", mode: "0644" }
        - { src: "{{ inventory_hostname }}.crt", dest: "{{ ssl_cert_path }}", mode: "0644" }
        - { src: "{{ inventory_hostname }}.key", dest: "{{ ssl_key_path }}", mode: "0600" }

    - name: Certificati - Pulizia locale control node
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: /tmp/ldap_certs_transit
        state: absent
      run_once: true

    # =========================================================================
    # FASE CLUSTER: LOGICA DI CONFIGURAZIONE BASE
    # =========================================================================

    - name: 1. Installazione di OpenLDAP e utility client
      ansible.builtin.apt:
        name:
          - slapd
          - ldap-utils
          - python-is-python3
        state: present
        update_cache: true

    - name: "Garantisci che slapd sia attivo per accettare configurazioni"
      ansible.builtin.service:
        name: slapd
        state: started

    - name: 2. Configurazione dei parametri di default in /etc/ldap/ldap.conf
      ansible.builtin.blockinfile:
        path: /etc/ldap/ldap.conf
        block: |
          BASE    {{ ldap_basedn }}
          URI     ldaps://localhost
          TLS_CACERT {{ ssl_ca_path }}
          TLS_REQCERT demand
        marker: "# {mark} ANSIBLE MANAGED BLOCK - DEFAULT LDAP SETTINGS"

    - name: 2b. Generazione LDIF configurazione livello Log avanzato (stats sync)
      ansible.builtin.copy:
        dest: /tmp/01_loglevel.ldif
        mode: "0600"
        content: |
          dn: cn=config
          changetype: modify
          replace: olcLogLevel
          olcLogLevel: stats sync

    - name: 2c. Applicazione livello di log a cn=config
      ansible.builtin.command: ldapmodify -Y EXTERNAL -H ldapi:/// -f /tmp/01_loglevel.ldif
      register: log_init_result
      failed_when: log_init_result.rc != 0
      changed_when: true

    - name: "2d. Tuning dei thread e limiti connessioni in cn=config"
      ansible.builtin.copy:
        dest: /tmp/01_threads_tuning.ldif
        mode: "0600"
        content: |
          dn: cn=config
          changetype: modify
          replace: olcThreads
          olcThreads: 32
          -
          replace: olcConnMaxPending
          olcConnMaxPending: 200
          -
          replace: olcConnMaxPendingAuth
          olcConnMaxPendingAuth: 50

    - name: "2e. Applicazione tuning thread"
      ansible.builtin.command: ldapmodify -Y EXTERNAL -H ldapi:/// -f /tmp/01_threads_tuning.ldif
      register: threads_result
      failed_when: threads_result.rc != 0
      changed_when: true

    - name: 3. Configurazione della password di Root in formato SSHA
      ansible.builtin.command: slappasswd -s {{ ldap_rootpw }}
      register: ldap_hashed_pw
      changed_when: false

    - name: 4. Creazione del file LDIF per la configurazione del Database base
      ansible.builtin.copy:
        dest: /tmp/01_db_init.ldif
        mode: "0600"
        content: |
          dn: olcDatabase={1}mdb,cn=config
          changetype: modify
          replace: olcSuffix
          olcSuffix: {{ ldap_basedn }}
          -
          replace: olcRootDN
          olcRootDN: {{ ldap_rootdn }}
          -
          replace: olcRootPW
          olcRootPW: {{ ldap_hashed_pw.stdout }}

    - name: 5. Applicazione configurazione Database di base
      ansible.builtin.command: ldapmodify -Y EXTERNAL -H ldapi:/// -f /tmp/01_db_init.ldif
      register: db_init_result
      failed_when: "'ERR' in db_init_result.stderr and 'Duplicate' not in db_init_result.stderr"
      changed_when: true

    - name: A. Blocco dei Bind Anonimi a livello globale
      ansible.builtin.copy:
        dest: /tmp/01b_disable_anon.ldif
        mode: "0600"
        content: |
          dn: cn=config
          changetype: modify
          add: olcRequires
          olcRequires: authc
          -
          add: olcDisallows
          olcDisallows: bind_anon

    - name: B. Applicazione blocco anonimi
      ansible.builtin.command: ldapmodify -Y EXTERNAL -H ldapi:/// -f /tmp/01b_disable_anon.ldif
      register: anon_result
      failed_when:
        - anon_result.rc != 0
        - "'Type or value exists' not in anon_result.stderr"
      changed_when: true

    - name: Enable ppolicy module
      community.general.ldap_attrs:
        dn: "cn=module{0},cn=config"
        attributes:
          olcModuleLoad: "ppolicy.la"
        state: present

    - name: C. Generazione LDIF per ACL Globali Corrette con livello zero SASL External e PPolicy
      ansible.builtin.copy:
        dest: /tmp/01c_acl_init.ldif
        mode: "0600"
        content: |
          dn: olcDatabase={1}mdb,cn=config
          changetype: modify
          replace: olcAccess
          olcAccess: {0}to * by dn.exact="gidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth" manage by * break
          olcAccess: {1}to dn.base="" by anonymous read by * read
          olcAccess: {2}to dn.base="cn=Subschema" by anonymous read by * read
          olcAccess: {3}to attrs=userPassword,pwdReset
            by self write
            by dn.exact="{{ ldap_rootdn }}" write
            by group.exact="{{ ldap_admin_group }}" write
            by dn.subtree="ou=system,{{ ldap_basedn }}" read
            by * auth
          olcAccess: {4}to attrs=shadowLastChange,pwdChangedTime,pwdFailureTime,pwdAccountLockedTime,pwdHistory
            by self read
            by dn.exact="{{ ldap_rootdn }}" write
            by group.exact="{{ ldap_admin_group }}" write
            by dn.subtree="ou=system,{{ ldap_basedn }}" read
            by * none
          olcAccess: {5}to dn.subtree="{{ ldap_basedn }}"
            by dn.exact="{{ ldap_rootdn }}" write
            by group.exact="{{ ldap_admin_group }}" write
            by dn.subtree="ou=system,{{ ldap_basedn }}" read
            by self write
            by users read
            by * none

    - name: D. Applicazione ACL Globali
      ansible.builtin.command: ldapmodify -Y EXTERNAL -H ldapi:/// -f /tmp/01c_acl_init.ldif
      register: acl_result
      failed_when:
        - acl_result.rc != 0
      changed_when: true

    # =========================================================================
    # INIZIALIZZAZIONE ATOMICA DEL DIT (Radice + Sottostruttura)
    # =========================================================================

    - name: E. Generazione LDIF per la Radice del DIT
      ansible.builtin.copy:
        dest: /tmp/01_root_dit.ldif
        mode: "0600"
        content: |
          dn: {{ ldap_basedn }}
          changetype: add
          objectClass: top
          objectClass: dcObject
          objectClass: organization
          o: example.com
          dc: example
      run_once: true
      delegate_to: "{{ ca_server }}"

    - name: F. Applicazione Radice DIT con Bind Amministrativo (Solo sul primo nodo)
      ansible.builtin.command: ldapadd -x -D "{{ ldap_rootdn }}" -w "{{ ldap_rootpw }}" -H ldapi:/// -f /tmp/01_root_dit.ldif
      register: root_dit_result
      failed_when:
        - root_dit_result.rc != 0
        - "'Already exists' not in root_dit_result.stderr"
      run_once: true
      delegate_to: "{{ ca_server }}"
      changed_when: true

    - name: E2. Generazione LDIF dinamica per OUs, Gruppo e Nodi Server mTLS
      ansible.builtin.copy:
        dest: /tmp/02_sub_dit.ldif
        mode: "0600"
        content: |
          dn: ou=system,{{ ldap_basedn }}
          changetype: add
          objectClass: top
          objectClass: organizationalUnit
          ou: system

          dn: ou=groups,{{ ldap_basedn }}
          changetype: add
          objectClass: top
          objectClass: organizationalUnit
          ou: groups

          dn: ou=people,{{ ldap_basedn }}
          changetype: add
          objectClass: top
          objectClass: organizationalUnit
          ou: people

          dn: {{ ldap_admin_group }}
          changetype: add
          objectClass: top
          objectClass: groupOfNames
          cn: administrators
          member: cn=admin,{{ ldap_basedn }}

          {% for node in cluster_nodes %}
          dn: cn={{ node }},ou=system,{{ ldap_basedn }}
          changetype: add
          objectClass: top
          objectClass: applicationProcess
          cn: {{ node }}

          {% endfor %}
      run_once: true
      delegate_to: "{{ ca_server }}"

    - name: F2. Applicazione sottostruttura DIT con Bind Amministrativo (Solo sul primo nodo)
      ansible.builtin.command: ldapadd -x -D "{{ ldap_rootdn }}" -w "{{ ldap_rootpw }}" -H ldapi:/// -f /tmp/02_sub_dit.ldif
      register: sub_dit_result
      failed_when:
        - sub_dit_result.rc != 0
        - "'Already exists' not in sub_dit_result.stderr"
        - "'Constraint violation' not in sub_dit_result.stderr"
      run_once: true
      delegate_to: "{{ ca_server }}"
      changed_when: true

    - name: F3. Generazione e applicazione Limiti Illimitati per i nodi in ou=system
      ansible.builtin.copy:
        dest: /tmp/01f_limits_repl.ldif
        mode: "0600"
        content: |
          dn: olcDatabase={1}mdb,cn=config
          changetype: modify
          add: olcLimits
          olcLimits: dn.subtree="ou=system,{{ ldap_basedn }}" size.soft=unlimited size.hard=unlimited time.soft=unlimited time.hard=unlimited

    - name: F4. Applicazione Limiti Replica
      ansible.builtin.command: ldapmodify -Y EXTERNAL -H ldapi:/// -f /tmp/01f_limits_repl.ldif
      register: limits_result
      failed_when:
        - limits_result.rc != 0
        - "'Type or value exists' not in limits_result.stderr"
      changed_when: true

    # =========================================================================
    # INIEZIONE PARAMETRI TLS, AUTHZREGEXP E RIAVVIO STRUTTURALE CLIENT
    # =========================================================================
    - name: "[LDAPS] Aggiunta della regola AuthzRegexp per i certificati mTLS"
      ansible.builtin.copy:
        dest: /tmp/01_authz_config.ldif
        mode: "0600"
        content: |
          dn: cn=config
          changetype: modify
          add: olcAuthzRegexp
          olcAuthzRegexp: "^cn=([^,]+),.*" "cn=$1,ou=system,{{ ldap_basedn }}"

    - name: "[LDAPS] Applicazione AuthzRegexp in cn=config (ignora se già esistente)"
      ansible.builtin.command: ldapmodify -Y EXTERNAL -H ldapi:/// -f /tmp/01_authz_config.ldif
      register: authz_add_result
      failed_when:
        - authz_add_result.rc != 0
        - "'Type or value exists' not in authz_add_result.stderr"
        - "'Attribute or value exists' not in authz_add_result.stderr"
      changed_when: true

    - name: "[LDAPS] 2. Generazione e aggiunta della nuova regola AuthzRegexp e parametri TLS"
      ansible.builtin.copy:
        dest: /tmp/01_tls_config.ldif
        mode: "0600"
        content: |
          dn: cn=config
          changetype: modify
          replace: olcTLSVerifyClient
          olcTLSVerifyClient: try
          -
          replace: olcTLSCACertificateFile
          olcTLSCACertificateFile: {{ ssl_ca_path }}
          -
          replace: olcTLSCertificateFile
          olcTLSCertificateFile: {{ ssl_cert_path }}
          -
          replace: olcTLSCertificateKeyFile
          olcTLSCertificateKeyFile: {{ ssl_key_path }}

    - name: "[LDAPS] Applicazione configurazione TLS e AuthzRegexp in cn=config"
      ansible.builtin.command: ldapmodify -Y EXTERNAL -H ldapi:/// -f /tmp/01_tls_config.ldif
      register: tls_apply_result
      failed_when:
        - tls_apply_result.rc != 0
      changed_when: true

    - name: 14. Configurazione ascolto slapd su tutte le interfacce di rete (PRIMA del riavvio)
      ansible.builtin.lineinfile:
        path: /etc/default/slapd
        regexp: "^SLAPD_SERVICES="
        line: 'SLAPD_SERVICES="ldap:/// ldapi:/// ldaps:///"'

    - name: "[FORZATURA] Riavvio completo per inizializzare i contesti Client TLS interni"
      ansible.builtin.service:
        name: slapd
        state: restarted

    # =========================================================================
    # CONFIGURAZIONE REPLICA INTELLIGENTE VIA LDAPS (SASL / EXTERNAL) - DINAMICA
    # =========================================================================

    - name: "6. Generazione LDIF dinamico per ServerID globali in cn=config"
      ansible.builtin.copy:
        dest: /tmp/02_serverid.ldif
        mode: "0600"
        content: |
          dn: cn=config
          changetype: modify
          replace: olcServerID
          {% for node in cluster_nodes %}
          olcServerID: {{ loop.index }} ldaps://{{ node }}
          {% endfor %}

    - name: "6b. Applicazione ServerID"
      ansible.builtin.command: ldapmodify -Y EXTERNAL -H ldapi:/// -f /tmp/02_serverid.ldif
      register: serverid_result
      failed_when:
        - serverid_result.rc != 0
        - "'Type or value exists' not in serverid_result.stderr"
        - "'Already exists' not in serverid_result.stderr"
      changed_when: true

    - name: "7. Caricamento modulo syncprov"
      community.general.ldap_attrs:
        dn: "cn=module{0},cn=config"
        attributes:
          olcModuleLoad: "syncprov"
        state: present

    - name: "8. Generazione LDIF per attivazione e tuning avanzato overlay syncprov"
      ansible.builtin.copy:
        dest: /tmp/03_enable_overlays.ldif
        mode: "0600"
        content: |
          dn: olcOverlay=syncprov,olcDatabase={1}mdb,cn=config
          changetype: add
          objectClass: olcOverlayConfig
          objectClass: olcSyncProvConfig
          olcOverlay: syncprov
          olcSpSessionlog: 10000
          olcSpCheckpoint: 1000 10

    - name: "9. Applicazione overlay syncprov e parametri di session log"
      ansible.builtin.command: ldapadd -Y EXTERNAL -H ldapi:/// -f /tmp/03_enable_overlays.ldif
      register: overlay_result
      failed_when:
        - overlay_result.rc != 0
        - "'already in list' not in overlay_result.stderr"
        - "'Already exists' not in overlay_result.stderr"
      changed_when: true

    - name: 10. Generazione LDIF per Syncrepl e MultiProvider via LDAPS (SASL EXTERNAL) - Completamente Dinamico
      ansible.builtin.copy:
        dest: /tmp/04_multimaster.ldif
        mode: "0600"
        content: |
          dn: olcDatabase={1}mdb,cn=config
          changetype: modify
          replace: olcSyncRepl
          {% for node in cluster_nodes %}
          {% if node != inventory_hostname %}
          olcSyncRepl: rid={{ "%03d" | format(loop.index) }} provider=ldaps://{{ node }}:636 bindmethod=sasl saslmech=EXTERNAL searchbase="{{ ldap_basedn }}" type=refreshAndPersist retry="5 10 10 30 60 120 300 +" timeout=120 network-timeout=15 keepalive=240:4:15 tls_cacert={{ ssl_ca_path }} tls_cert={{ ssl_cert_path }} tls_key={{ ssl_key_path }} tls_reqcert=demand
          {% endif %}
          {% endfor %}
          -
          replace: olcMultiProvider
          olcMultiProvider: TRUE

    - name: 11. Applicazione configurazione Syncrepl e MultiProvider
      ansible.builtin.command: ldapmodify -Y EXTERNAL -H ldapi:/// -f /tmp/04_multimaster.ldif
      register: multimaster_result
      failed_when: >
        multimaster_result.rc != 0 and
        'Already exists' not in multimaster_result.stderr and
        'Duplicate' not in multimaster_result.stderr and
        'typeIsCritical' not in multimaster_result.stderr and
        'Type or value exists' not in multimaster_result.stderr
      changed_when: true

    # =========================================================================
    # PARAMETRI DI TUNING: ATTIVAZIONE DB SYNC
    # =========================================================================

    - name: G. Generazione LDIF per Indici, MaxSize e Tuning MDB (DB SYNC ATTIVO)
      ansible.builtin.copy:
        dest: /tmp/06_db_tuning.ldif
        mode: "0600"
        content: |
          dn: olcDatabase={1}mdb,cn=config
          changetype: modify
          replace: olcDbMaxSize
          olcDbMaxSize: 4294967296
          -
          replace: olcDbNoSync
          olcDbNoSync: TRUE
          -
          replace: olcDbIndex
          olcDbIndex: objectClass eq
          olcDbIndex: uid eq
          olcDbIndex: cn eq,sub
          olcDbIndex: member eq
          olcDbIndex: memberUid eq
          olcDbIndex: entryUUID eq
          olcDbIndex: entryCSN eq

          dn: cn=config
          changetype: modify
          replace: olcWriteTimeout
          olcWriteTimeout: 30

    - name: H. Applicazione parametri di Tuning Database
      ansible.builtin.command: ldapmodify -Y EXTERNAL -H ldapi:/// -f /tmp/06_db_tuning.ldif
      register: tuning_result
      failed_when:
        - tuning_result.rc != 0
        - "'Type or value exists' not in tuning_result.stderr"
        - "'attribute OR type already exists' not in tuning_result.stderr"
      changed_when: true

    - name: 12. Generazione LDIF per inizializzazione/aggiornamento del backend cn=Monitor
      ansible.builtin.copy:
        dest: /tmp/05_monitor.ldif
        mode: "0600"
        content: |
          dn: olcDatabase={2}monitor,cn=config
          changetype: add
          objectClass: olcDatabaseConfig
          olcDatabase: {2}monitor
          olcAccess: {0}to * by dn.base="{{ ldap_rootdn }}" read by group.exact="{{ ldap_admin_group }}" read by * none

    - name: 13. Applicazione configurazione backend cn=Monitor
      ansible.builtin.command: ldapadd -Y EXTERNAL -H ldapi:/// -f /tmp/05_monitor.ldif
      register: monitor_result
      failed_when:
        - monitor_result.rc != 0
        - "'Already exists' not in monitor_result.stderr"
        - "'Type or value exists' not in monitor_result.stderr"
        - "'only one monitor database allowed' not in monitor_result.stderr"
      changed_when: true

  handlers:
    - name: Riavvia Slapd
      ansible.builtin.service:
        name: slapd
        state: restarted
