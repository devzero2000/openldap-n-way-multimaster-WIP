# ==============================================================================
# TITOLO:       Bulk Deletion Massiva per Dataset Nestgroup + Dynlist
# SCOPO:        Generare un file LDIF di cancellazione per 30k utenti e gruppi
#               ed eseguirlo in blocco tramite ldapmodify per una massima velocità.
# ==============================================================================

---
- name: "Pulizia Massiva e Veloce del Dataset di Test"
  hosts: cluster
  become: true
  vars:
    suffix: "dc=example,dc=com"
    ldif_del_path: "/tmp/stress_delete_data.ldif"
    ldap_pw: "openldap"

  tasks:
    - name: "[TEMPLATING] Genera lo script Python per la creazione del file LDIF di eliminazione"
      ansible.builtin.copy:
        dest: /tmp/generate_delete_ldif.py
        mode: '0755'
        content: |
          #!/usr/bin/env python3
          suffix = "{{ suffix }}"

          with open("{{ ldif_del_path }}", "w") as f:
              # 1. Cancellazione dei Ruoli Globali di Vertice (10)
              for i in range(1, 11):
                  f.write(f"dn: cn=root.architect.{i},ou=groups,{suffix}\nchangetype: delete\n\n")

              # 2. Cancellazione dei Gruppi Periferici (30.000)
              for i in range(1, 30001):
                  f.write(f"dn: cn=group.{i},ou=groups,{suffix}\nchangetype: delete\n\n")

              # 3. Cancellazione degli Utenti (30.000)
              for i in range(1, 30001):
                  f.write(f"dn: uid=user.{i},ou=People,{suffix}\nchangetype: delete\n\n")

          print("File LDIF di cancellazione generato con successo.")
      delegate_to: "{{ groups['cluster'][0] }}"
      run_once: true

    - name: "[EXECUTE] Esegui lo script Python per creare l'LDIF di delete"
      ansible.builtin.command: python3 /tmp/generate_delete_ldif.py
      delegate_to: "{{ groups['cluster'][0] }}"
      run_once: true
      changed_when: true

    - name: "[IMPORT/DELETE] Esegui la cancellazione massiva in blocco con ldapmodify"
      ansible.builtin.command: >
        ldapmodify -c -H ldapi:/// -x -D "cn=admin,{{ suffix }}" -w "{{ ldap_pw }}" -f "{{ ldif_del_path }}"
      register: ldapdel_res
      delegate_to: "{{ groups['cluster'][0] }}"
      run_once: true
      changed_when: true
      failed_when: "ldapdel_res.rc != 0 and 'No such object' not in ldapdel_res.stderr"

    - name: "[CLEANUP] Rimuovi il file LDIF temporaneo e lo script di generazione"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/generate_delete_ldif.py"
        - "{{ ldif_del_path }}"
      delegate_to: "{{ groups['cluster'][0] }}"
      run_once: true
