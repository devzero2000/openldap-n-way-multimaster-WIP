# ==============================================================================
# TITOLO:       Verifica Convergenza Replica Dataset Custom Scale (Conteggi)
# AUTORE:       Elia Pinto
# DATA:         Settembre 2026
# VERSIONE:     1.1 (review)
# SCOPO:        Confermare che TUTTI i nodi (master + repliche read-only)
#               abbiano ricevuto l'intero dataset custom-scale, contando
#               separatamente entry (utenti/gruppi) e il totale delle
#               appartenenze (valori "member:" sommati su tutti i gruppi) -
#               quest'ultimo intercetta anche il caso di un'entry presente
#               ma con la lista membri incompleta, che un conteggio di sole
#               entry non rileverebbe.
#
# NOVITÀ v1.1 rispetto a v1.0 (review manuale mirata alle regole di
# ansible-lint - non un vero passaggio dello strumento, che non e' stato
# possibile eseguire per assenza di rete nell'ambiente di verifica):
#   - I 5 task [COUNT] (risky-shell-pipe): usavano "slapcat | grep -c" o
#     "slapcat | awk" senza alcuna protezione sulla pipe. Se slapcat
#     fallisse per qualunque motivo (permessi, DB bloccato, argomento -b
#     sbagliato), il codice di uscita della pipe avrebbe riflesso solo
#     grep/awk - che leggendo un output vuoto/troncato avrebbero comunque
#     restituito un conteggio plausibile (spesso zero), mascherando un
#     errore reale come se fosse un dato legittimo. Il precedente
#     failed_when:false (necessario perche' grep -c ritorna rc=1 su zero
#     corrispondenze, un dato valido) rendeva la cosa ancora piu' cieca:
#     sopprimeva QUALUNQUE fallimento, non solo quello legittimo di grep.
#     Corretto con ${PIPESTATUS[0]} (richiede args.executable: /bin/bash):
#     controlla esplicitamente solo l'esito di slapcat, lasciando grep/awk
#     liberi di restituire zero senza che questo faccia fallire il task -
#     un vero fallimento di slapcat ora fa fallire il task in modo
#     esplicito, failed_when:false non serve piu' ed e' stato rimosso.
#     ATTENZIONE (scoperta testando empiricamente il fix, non per
#     supposizione): PIPESTATUS NON si propaga se la pipe e' racchiusa in
#     un command substitution $(...) - il command substitution gira in
#     una subshell separata, e l'array PIPESTATUS di quella subshell non
#     e' visibile nella shell chiamante. La pipe va quindi eseguita
#     DIRETTAMENTE (con l'output rediretto su un file temporaneo, letto
#     subito dopo), non avvolta in $(...) - la prima versione del fix, che
#     usava "count=$(pipe...)", sarebbe risultata silenziosamente rotta
#     (PIPESTATUS[0] sempre a un valore non significativo).
# ==============================================================================
---
- name: "Conteggio locale del dataset custom-scale su ciascun nodo"
  hosts:
    - cluster
    - readonlyreplica
  become: true
  vars:
    suffix: "dc=example,dc=com"

  tasks:
    # NOTA: qui si usa slapcat (dump diretto dei file del database) invece
    # di ldapsearch. slapcat bypassa del tutto il protocollo LDAP - niente
    # size limit (il problema che aveva questo stesso file in precedenza,
    # dove nemmeno "-z 0" lato client bastava perche' il limite era
    # configurato come hard limit sul server), niente ACL, niente bind.
    # Stesso identico pattern gia' usato con successo per tutta questa
    # sessione di debug tramite lo script conta.sh manuale.

    # NOTA (dopo verifica manuale con le regole di ansible-lint): le pipe
    # slapcat|grep/awk qui sotto usano ${PIPESTATUS[0]} per controllare
    # SOLO l'esito di slapcat, non quello di grep/awk - grep -c ritorna
    # rc=1 quando trova zero corrispondenze (un dato legittimo, non un
    # errore), quindi un semplice "set -o pipefail" da solo non basterebbe
    # a distinguere "slapcat e' fallito" da "trovate correttamente zero
    # entry": userebbe lo stesso codice di uscita per entrambi i casi.
    # Con il controllo esplicito su PIPESTATUS[0], un vero fallimento di
    # slapcat (permessi, DB bloccato, argomento -b sbagliato) fa fallire
    # il task in modo esplicito, mentre uno zero legittimo di grep/awk
    # continua a essere trattato come il dato valido che e' - quindi
    # failed_when:false non serve piu', il codice di uscita del task
    # riflette ora correttamente solo i problemi veri.

    - name: "[COUNT] Utenti custom-scale-user-*"
      ansible.builtin.shell: |
        set -o pipefail
        slapcat -b "{{ suffix }}" -s "ou=People,{{ suffix }}" | grep -c "^dn: uid=custom-scale-user-" > /tmp/count_out.$$
        slapcat_rc=${PIPESTATUS[0]}
        count=$(cat /tmp/count_out.$$)
        rm -f /tmp/count_out.$$
        if [ "$slapcat_rc" -ne 0 ]; then
          echo "ERRORE: slapcat e' fallito con rc=${slapcat_rc}" >&2
          exit 1
        fi
        echo "$count"
      args:
        executable: /bin/bash
      register: user_count_raw
      changed_when: false

    - name: "[COUNT] Gruppi custom-scale-group-* (generici)"
      ansible.builtin.shell: |
        set -o pipefail
        slapcat -b "{{ suffix }}" -s "ou=groups,{{ suffix }}" | grep -c "^dn: cn=custom-scale-group-" > /tmp/count_out.$$
        slapcat_rc=${PIPESTATUS[0]}
        count=$(cat /tmp/count_out.$$)
        rm -f /tmp/count_out.$$
        if [ "$slapcat_rc" -ne 0 ]; then
          echo "ERRORE: slapcat e' fallito con rc=${slapcat_rc}" >&2
          exit 1
        fi
        echo "$count"
      args:
        executable: /bin/bash
      register: group_count_raw
      changed_when: false

    - name: "[COUNT] Gruppi deep-tier"
      ansible.builtin.shell: |
        set -o pipefail
        slapcat -b "{{ suffix }}" -s "ou=groups,{{ suffix }}" | grep -c "^dn: cn=custom-scale-deep-tier-" > /tmp/count_out.$$
        slapcat_rc=${PIPESTATUS[0]}
        count=$(cat /tmp/count_out.$$)
        rm -f /tmp/count_out.$$
        if [ "$slapcat_rc" -ne 0 ]; then
          echo "ERRORE: slapcat e' fallito con rc=${slapcat_rc}" >&2
          exit 1
        fi
        echo "$count"
      args:
        executable: /bin/bash
      register: deep_tier_count_raw
      changed_when: false

    - name: "[COUNT] Gruppi radice deep-nesting"
      ansible.builtin.shell: |
        set -o pipefail
        slapcat -b "{{ suffix }}" -s "ou=groups,{{ suffix }}" | grep -c "^dn: cn=custom-scale-root-deep-" > /tmp/count_out.$$
        slapcat_rc=${PIPESTATUS[0]}
        count=$(cat /tmp/count_out.$$)
        rm -f /tmp/count_out.$$
        if [ "$slapcat_rc" -ne 0 ]; then
          echo "ERRORE: slapcat e' fallito con rc=${slapcat_rc}" >&2
          exit 1
        fi
        echo "$count"
      args:
        executable: /bin/bash
      register: root_deep_count_raw
      changed_when: false

    - name: "[COUNT] Totale valori 'member:' su tutti i gruppi custom-scale (somma appartenenze)"
      ansible.builtin.shell: |
        set -o pipefail
        slapcat -b "{{ suffix }}" -s "ou=groups,{{ suffix }}" | awk '
          /^dn: cn=custom-scale-(group|deep-tier|root-deep)-/ { inrecord=1; next }
          /^dn:/ { inrecord=0; next }
          inrecord && /^member:/ { count++ }
          END { print count+0 }
        ' > /tmp/count_out.$$
        slapcat_rc=${PIPESTATUS[0]}
        count=$(cat /tmp/count_out.$$)
        rm -f /tmp/count_out.$$
        if [ "$slapcat_rc" -ne 0 ]; then
          echo "ERRORE: slapcat e' fallito con rc=${slapcat_rc}" >&2
          exit 1
        fi
        echo "$count"
      args:
        executable: /bin/bash
      register: member_count_raw
      changed_when: false

    - name: "[COMPUTA] Estrai i conteggi numerici da ciascun output"
      ansible.builtin.set_fact:
        n_users: "{{ user_count_raw.stdout | trim | default('0', true) | int }}"
        n_groups: "{{ group_count_raw.stdout | trim | default('0', true) | int }}"
        n_deep_tier: "{{ deep_tier_count_raw.stdout | trim | default('0', true) | int }}"
        n_root_deep: "{{ root_deep_count_raw.stdout | trim | default('0', true) | int }}"
        n_memberships: "{{ member_count_raw.stdout | trim | default('0', true) | int }}"

    - name: "[REPORT LOCALE] Conteggi su questo nodo"
      ansible.builtin.debug:
        msg:
          - "Nodo: {{ inventory_hostname }}"
          - "Utenti custom-scale:          {{ n_users }}"
          - "Gruppi generici:              {{ n_groups }}"
          - "Gruppi deep-tier:             {{ n_deep_tier }}"
          - "Gruppi radice deep-nesting:   {{ n_root_deep }}"
          - "Totale appartenenze (member:): {{ n_memberships }}"

# =============================================================================
# CONFRONTO INCROCIATO FRA TUTTI I NODI
# =============================================================================
- name: "Confronto conteggi fra tutti i nodi (master + repliche)"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    all_nodes: "{{ groups['cluster'] + groups['readonlyreplica'] }}"
    reference_node: "{{ (groups['cluster'] | sort | first) }}"

    # Se vuoi anche validare i conteggi contro i numeri attesi dal generatore
    # (non solo la coerenza fra nodi), tienili allineati a
    # create_custom_scale_data_nested_group_memberof.yml
    total_users: 8000
    total_groups: 30000
    deep_nesting_levels: 15
    deep_nesting_root_groups: 3

  tasks:
    - name: "[TABELLA] Riepilogo conteggi per nodo"
      ansible.builtin.debug:
        msg: >-
          {{ item }}:
          utenti={{ hostvars[item].n_users }}
          gruppi={{ hostvars[item].n_groups }}
          deep_tier={{ hostvars[item].n_deep_tier }}
          root_deep={{ hostvars[item].n_root_deep }}
          appartenenze={{ hostvars[item].n_memberships }}
      loop: "{{ all_nodes }}"

    - name: "[CONVERGENZA] Ogni nodo deve avere lo stesso conteggio utenti del nodo di riferimento ({{ reference_node }})"
      ansible.builtin.assert:
        that:
          - hostvars[item].n_users == hostvars[reference_node].n_users
        fail_msg: >-
          NON CONVERGENTE: {{ item }} ha {{ hostvars[item].n_users }} utenti,
          {{ reference_node }} ne ha {{ hostvars[reference_node].n_users }}.
        success_msg: "{{ item }}: utenti allineati a {{ reference_node }}"
      loop: "{{ all_nodes }}"

    - name: "[CONVERGENZA] Ogni nodo deve avere lo stesso conteggio gruppi generici del nodo di riferimento"
      ansible.builtin.assert:
        that:
          - hostvars[item].n_groups == hostvars[reference_node].n_groups
        fail_msg: >-
          NON CONVERGENTE: {{ item }} ha {{ hostvars[item].n_groups }} gruppi,
          {{ reference_node }} ne ha {{ hostvars[reference_node].n_groups }}.
        success_msg: "{{ item }}: gruppi generici allineati a {{ reference_node }}"
      loop: "{{ all_nodes }}"

    - name: "[CONVERGENZA] Ogni nodo deve avere lo stesso conteggio gruppi deep-tier del nodo di riferimento"
      ansible.builtin.assert:
        that:
          - hostvars[item].n_deep_tier == hostvars[reference_node].n_deep_tier
        fail_msg: "NON CONVERGENTE su deep-tier: {{ item }} vs {{ reference_node }}"
        success_msg: "{{ item }}: gruppi deep-tier allineati a {{ reference_node }}"
      loop: "{{ all_nodes }}"

    - name: "[CONVERGENZA] Ogni nodo deve avere lo stesso conteggio gruppi radice del nodo di riferimento"
      ansible.builtin.assert:
        that:
          - hostvars[item].n_root_deep == hostvars[reference_node].n_root_deep
        fail_msg: "NON CONVERGENTE su gruppi radice: {{ item }} vs {{ reference_node }}"
        success_msg: "{{ item }}: gruppi radice allineati a {{ reference_node }}"
      loop: "{{ all_nodes }}"

    - name: "[CONVERGENZA] Ogni nodo deve avere lo stesso totale appartenenze (member:) del nodo di riferimento"
      ansible.builtin.assert:
        that:
          - hostvars[item].n_memberships == hostvars[reference_node].n_memberships
        fail_msg: >-
          NON CONVERGENTE: {{ item }} ha {{ hostvars[item].n_memberships }}
          appartenenze totali, {{ reference_node }} ne ha
          {{ hostvars[reference_node].n_memberships }} - possibile perdita di
          dati sulle liste membri (non solo entry mancanti, ma contenuto
          incompleto di entry che pure esistono su entrambi i nodi).
        success_msg: "{{ item }}: totale appartenenze allineato a {{ reference_node }}"
      loop: "{{ all_nodes }}"

    - name: "[COERENZA CON I PARAMETRI ATTESI] I conteggi sul nodo di riferimento corrispondono a quanto generato?"
      ansible.builtin.assert:
        that:
          - hostvars[reference_node].n_users | int == total_users
          - hostvars[reference_node].n_groups | int == total_groups
          - hostvars[reference_node].n_deep_tier | int == deep_nesting_levels
          - hostvars[reference_node].n_root_deep | int == deep_nesting_root_groups
        fail_msg: >-
          I conteggi su {{ reference_node }} non corrispondono ai parametri
          attesi (total_users/total_groups/deep_nesting_*) - dataset
          incompleto, non ancora generato, o generato con parametri diversi
          da quelli impostati qui in cima al file.
        success_msg: "OK: i conteggi corrispondono ai parametri attesi del generatore."
