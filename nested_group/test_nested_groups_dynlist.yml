# ==============================================================================
# TITOLO:       Automazione Test Gruppi Annidati (Nested Groups + Dynlist)
# AUTORE:       Elia Pinto
# DATA:         Luglio 2026
# VERSIONE:     2.2
# SCOPO:        Iniettare un dataset di test, validare la ricorsione di 'memberOf'
#               tramite l'azione congiunta di nestgroup e dynlist, e gestire la pulizia.
# ==============================================================================

---
- name: "Test e Validazione Completa Nested Groups & Dynlist sul Cluster OpenLDAP"
  hosts: cluster
  become: true
  vars:
    # Stato del ciclo di vita: 'start' (crea e testa) oppure 'stop' (pulisce)
    stato: "start"

    suffix: "dc=example,dc=com"

    # Credenziali amministrative per le query
    ldap_auth:
      server_uri: "ldapi:///"
      bind_dn: "cn=admin,dc=example,dc=com"
      bind_pw: "openldap"

  tasks:

    # ==========================================================================
    # BLOCCO 1: STATO = STOP (PULIZIA COERENTE SUL PRIMO NODO)
    # ==========================================================================

    - name: "[STOP] Rimuovi il gruppo padre Cloud-Architect"
      community.general.ldap_entry:
        server_uri: "{{ ldap_auth.server_uri }}"
        bind_dn: "{{ ldap_auth.bind_dn }}"
        bind_pw: "{{ ldap_auth.bind_pw }}"
        dn: "cn=Cloud-Architect,ou=groups,{{ suffix }}"
        state: absent
      delegate_to: "{{ groups['cluster'][0] }}"
      run_once: true
      when: stato == "stop"

    - name: "[STOP] Rimuovi il sottogruppo Deploy-Stage1"
      community.general.ldap_entry:
        server_uri: "{{ ldap_auth.server_uri }}"
        bind_dn: "{{ ldap_auth.bind_dn }}"
        bind_pw: "{{ ldap_auth.bind_pw }}"
        dn: "cn=Deploy-Stage1,ou=groups,{{ suffix }}"
        state: absent
      delegate_to: "{{ groups['cluster'][0] }}"
      run_once: true
      when: stato == "stop"

    - name: "[STOP] Rimuovi l'utente di test Giovanni Bianchi"
      community.general.ldap_entry:
        server_uri: "{{ ldap_auth.server_uri }}"
        bind_dn: "{{ ldap_auth.bind_dn }}"
        bind_pw: "{{ ldap_auth.bind_pw }}"
        dn: "uid=giovanni.bianchi,ou=People,{{ suffix }}"
        state: absent
      delegate_to: "{{ groups['cluster'][0] }}"
      run_once: true
      when: stato == "stop"

    - name: "[STOP] Rimuovi l'utente di test Mario Rossi"
      community.general.ldap_entry:
        server_uri: "{{ ldap_auth.server_uri }}"
        bind_dn: "{{ ldap_auth.bind_dn }}"
        bind_pw: "{{ ldap_auth.bind_pw }}"
        dn: "uid=mario.rossi,ou=People,{{ suffix }}"
        state: absent
      delegate_to: "{{ groups['cluster'][0] }}"
      run_once: true
      when: stato == "stop"

    # ==========================================================================
    # BLOCCO 2: STATO = START (POPOLAMENTO DATASET DI TEST SUL PRIMO NODO)
    # ==========================================================================

    - name: "[START] Crea l'utente di test: Mario Rossi (Membro del Sottogruppo)"
      community.general.ldap_entry:
        server_uri: "{{ ldap_auth.server_uri }}"
        bind_dn: "{{ ldap_auth.bind_dn }}"
        bind_pw: "{{ ldap_auth.bind_pw }}"
        dn: "uid=mario.rossi,ou=People,{{ suffix }}"
        objectClass:
          - top
          - inetOrgPerson
        attributes:
          uid: "mario.rossi"
          cn: "Mario Rossi"
          sn: "Rossi"
          userPassword: "{SSHA}d3m0Xdfgklm12345!"
        state: present
      delegate_to: "{{ groups['cluster'][0] }}"
      run_once: true
      when: stato == "start"

    - name: "[START] Crea l'utente di test: Giovanni Bianchi (Membro Diretto del Padre)"
      community.general.ldap_entry:
        server_uri: "{{ ldap_auth.server_uri }}"
        bind_dn: "{{ ldap_auth.bind_dn }}"
        bind_pw: "{{ ldap_auth.bind_pw }}"
        dn: "uid=giovanni.bianchi,ou=People,{{ suffix }}"
        objectClass:
          - top
          - inetOrgPerson
        attributes:
          uid: "giovanni.bianchi"
          cn: "Giovanni Bianchi"
          sn: "Bianchi"
          userPassword: "{SSHA}d3m0Ydfgklm67890!"
        state: present
      delegate_to: "{{ groups['cluster'][0] }}"
      run_once: true
      when: stato == "start"

    - name: "[START] Crea il Sottogruppo: Deploy-Stage1"
      community.general.ldap_entry:
        server_uri: "{{ ldap_auth.server_uri }}"
        bind_dn: "{{ ldap_auth.bind_dn }}"
        bind_pw: "{{ ldap_auth.bind_pw }}"
        dn: "cn=Deploy-Stage1,ou=groups,{{ suffix }}"
        objectClass:
          - top
          - groupOfNames
        attributes:
          cn: "Deploy-Stage1"
          description: "Sottogruppo operativo per il deploy dello stage 1"
          member:
            - "uid=mario.rossi,ou=People,{{ suffix }}"
        state: present
      delegate_to: "{{ groups['cluster'][0] }}"
      run_once: true
      when: stato == "start"

    - name: "[START] Crea il Gruppo Padre: Cloud-Architect (Nesting con utente e sottogruppo)"
      community.general.ldap_entry:
        server_uri: "{{ ldap_auth.server_uri }}"
        bind_dn: "{{ ldap_auth.bind_dn }}"
        bind_pw: "{{ ldap_auth.bind_pw }}"
        dn: "cn=Cloud-Architect,ou=groups,{{ suffix }}"
        objectClass:
          - top
          - groupOfNames
        attributes:
          cn: "Cloud-Architect"
          description: "Ruolo Cloud Architect Globale (Contiene utenti e sottogruppi)"
          member:
            - "uid=giovanni.bianchi,ou=People,{{ suffix }}"
            - "cn=Deploy-Stage1,ou=groups,{{ suffix }}"
        state: present
      delegate_to: "{{ groups['cluster'][0] }}"
      run_once: true
      when: stato == "start"

    # ==========================================================================
    # BLOCCO 3: BATTERIA DEI 4 TEST DI VALIDAZIONE CONGIUNTI (NESTGROUP + DYNLIST)
    # (Eseguiti su tutti i nodi per verificare la propagazione della replica e la RAM)
    # ==========================================================================

    - name: "[TEST 1/4] Estrai gli utenti (ereditati via nestgroup) appartenenti a Cloud-Architect tramite dynlist"
      ansible.builtin.command: >
        ldapsearch -H ldap://localhost
        -D '{{ ldap_auth.bind_dn }}' -w '{{ ldap_auth.bind_pw }}'
        -b "ou=People,{{ suffix }}"
        -s sub "(&(objectClass=inetOrgPerson)(memberOf=cn=Cloud-Architect,ou=groups,{{ suffix }}))" dn
      register: test_1_res
      when: stato == "start"
      changed_when: false

    - name: "[TEST 2/4] Verifica gli utenti mappati nel sottogruppo di base Deploy-Stage1"
      ansible.builtin.command: >
        ldapsearch -H ldap://localhost
        -D '{{ ldap_auth.bind_dn }}' -w '{{ ldap_auth.bind_pw }}'
        -b "ou=People,{{ suffix }}"
        -s sub "(&(objectClass=inetOrgPerson)(memberOf=cn=Deploy-Stage1,ou=groups,{{ suffix }}))" dn
      register: test_2_res
      when: stato == "start"
      changed_when: false

    - name: "[TEST 3/4] Ispezione record completo di Mario Rossi per verificare la generazione RAM di memberOf"
      ansible.builtin.command: >
        ldapsearch -H ldap://localhost
        -D '{{ ldap_auth.bind_dn }}' -w '{{ ldap_auth.bind_pw }}'
        -b "uid=mario.rossi,ou=People,{{ suffix }}"
        -s base "(objectClass=*)" memberOf
      register: test_3_res
      when: stato == "start"
      changed_when: false

    - name: "[TEST 4/4] Estrai i membri strutturali dichiarati dentro l'oggetto Cloud-Architect"
      ansible.builtin.command: >
        ldapsearch -H ldap://localhost
        -D '{{ ldap_auth.bind_dn }}' -w '{{ ldap_auth.bind_pw }}'
        -b "cn=Cloud-Architect,ou=groups,{{ suffix }}"
        -s base "(objectClass=*)" member
      register: test_4_res
      when: stato == "start"
      changed_when: false

    # ==========================================================================
    # BLOCCO 4: OUTPUT DEI LOG DI AUDITING
    # ==========================================================================

    - name: "[REGISTRO] Visualizzazione risultati dei test di conformità"
      ansible.builtin.debug:
        msg:
          - "----------------------------------------------------------------"
          - "TEST 1: Utenti risolti nel ruolo Cloud-Architect (Mario Rossi ereditato + Giovanni diretto):"
          - "{{ test_1_res.stdout_lines | default(['Skipped']) }}"
          - "----------------------------------------------------------------"
          - "TEST 2: Utenti mappati nel sottogruppo Deploy-Stage1:"
          - "{{ test_2_res.stdout_lines | default(['Skipped']) }}"
          - "----------------------------------------------------------------"
          - "TEST 3: Mapping virtuale memberOf in RAM su Mario Rossi (deve includere sia Deploy-Stage1 che Cloud-Architect):"
          - "{{ test_3_res.stdout_lines | default(['Skipped']) }}"
          - "----------------------------------------------------------------"
          - "TEST 4: Membri reali scritti dentro Cloud-Architect:"
          - "{{ test_4_res.stdout_lines | default(['Skipped']) }}"
          - "----------------------------------------------------------------"
      when: stato == "start"
