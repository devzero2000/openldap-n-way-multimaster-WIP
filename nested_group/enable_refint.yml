# ==============================================================================
# TITOLO:       Gestione Dinamica slapo-refint su Cluster OpenLDAP
# SCOPO:        Abilitare o disabilitare l'overlay refint in base alla variabile
#               refint_state (valori ammessi: present/absent, default: present)
# ==============================================================================
---
- name: "Gestione Overlay Refint Unificata"
  hosts: cluster
  become: true
  vars:
    target_db: "olcDatabase={1}mdb,cn=config"
    refint_state: "present" # Valori possibili: present (abilita) o absent (disabilita)

  tasks:
    - name: "[SETUP] Carica il modulo globale refint in cn=config (necessario solo in attivazione)"
      community.general.ldap_attrs:
        server_uri: "ldapi:///"
        sasl_class: "external"
        dn: "cn=module{0},cn=config"
        attributes:
          olcModuleLoad:
            - "refint.la"
        state: present
      when: refint_state == "present"

    - name: "[CONFIG] Gestisci lo stato dell'overlay refint sul database"
      community.general.ldap_entry:
        server_uri: "ldapi:///"
        sasl_class: "external"
        dn: "olcOverlay={2}refint,{{ target_db }}"
        objectClass:
          - olcOverlayConfig
          - olcRefIntConfig
        attributes:
          olcOverlay: "{2}refint"
          olcRefIntAttribute: "member memberOf owner"
        state: "{{ refint_state }}"
