# ==============================================================================
# TITOLO:       Verifica Password Policy e Replicazione OpenLDAP Multi-Master (FIXED)
# SCOPO:        Verificare che la PPolicy e l'overlay siano presenti e coerenti
#               su tutti i nodi del cluster, gestendo gli errori di rete.
# ==============================================================================

---
- name: Verifica Password Policy e Replica OpenLDAP
  hosts: cluster
  become: true
  # Impostiamo un seriale per non saturare il cluster se il check è lento
  serial: 1 
  vars:
    suffix: "dc=example,dc=com"
    bind_dn: "cn=admin,{{ suffix }}"
    bind_pw: "openldap"
    policy_dn: "cn=default,ou=policies,{{ suffix }}"
    # N.B. Non hard-codiamo {1}mdb, usiamo la ricerca dinamica se possibile.
    # Ma per un semplice check di esistenza, ldapi:/// col suffix è sufficiente.

  tasks:
    # ==========================================================================
    # 1. VERIFICA LOCALE SU CN=CONFIG (Overlay)
    # ==========================================================================
    - name: "[LOCAL] Cerca l'overlay ppolicy in cn=config (ldapi)"
      community.general.ldap_search:
        server_uri: "ldapi:///"
        sasl_class: "external"
        dn: "cn=config"
        filter: "(olcOverlay=ppolicy)" # Cerca l'overlay ppolicy indipendentemente dall'indice
        scope: children # Cerca in tutta la sottostruttura di config
      register: local_overlay_search
      # Non falliamo qui, gestiamo l'assenza nel debug
      failed_when: false 

    - name: "[LOCAL] Report Stato Overlay Locale"
      ansible.builtin.debug:
        msg: >-
          Stato Overlay ppolicy su cn=config: 
          {{ 'TROVATO' if local_overlay_search.results is defined and local_overlay_search.results | length > 0 
             else 'NON TROVATO o ERRORE' }}

    # ==========================================================================
    # 2. VERIFICA LOCALE SUI DATI (Policy Entry e pwdCheckQuality)
    # ==========================================================================
    - name: "[LOCAL] Cerca l'entry della Password Policy sul DB locale (ldapi)"
      community.general.ldap_search:
        server_uri: "ldapi:///"
        bind_dn: "{{ bind_dn }}"
        bind_pw: "{{ bind_pw }}"
        dn: "{{ policy_dn }}"
        scope: "base"
      register: local_policy_search
      failed_when: false

    - name: "[LOCAL] Report e Debug Parametri Policy Locale"
      ansible.builtin.debug:
        msg:
          - "Stato Entry Policy 'default': {{ 'Trovata' if local_policy_search.results is defined and local_policy_search.results | length > 0 else 'ASSENTE' }}"
          - "pwdMinLength: {{ local_policy_search.results[0].pwdMinLength | default('N/A') }}"
          - "pwdCheckQuality: {{ local_policy_search.results[0].pwdCheckQuality | default('N/A') }}"
          - "pwdLockout: {{ local_policy_search.results[0].pwdLockout | default('N/A') }}"
      when: local_policy_search.results is defined and local_policy_search.results | length > 0

    # ==========================================================================
    # 3. VERIFICA CROSS-NODE / REPLICA (Ogni nodo interroga tutti gli ALTRI)
    # ==========================================================================
    - name: "[CROSS-CHECK] Interrogazione incrociata: Nodo {{ inventory_hostname }} interroga TUTTI i nodi"
      community.general.ldap_search:
        server_uri: "ldap://{{ item }}/"
        bind_dn: "{{ bind_dn }}"
        bind_pw: "{{ bind_pw }}"
        dn: "{{ policy_dn }}"
        scope: "base"
      loop: "{{ groups['cluster'] }}"
      register: cross_node_results
      failed_when: false # Cruciale: se un nodo è giù, il task non deve fallire, registriamo l'errore

    - name: "[CROSS-CHECK] Report Esito Replica (Host per Host)"
      ansible.builtin.debug:
        msg: >-
          Host {{ inventory_hostname }} -> Interrogando {{ item.item }}: 
          {% if item.failed %}
            CONNESSIONE FALLITA (Timeout o Host irraggiungibile)
          {% elif item.results is defined and item.results | length > 0 %}
            REPLICA OK (Policy trovata)
          {% else %}
            REPLICA FALLITA (Policy assente sul nodo remoto)
          {% endif %}
      loop: "{{ cross_node_results.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ==========================================================================
    # 4. ASSERT FINALE DI COERENZA
    # ==========================================================================
    - name: "[ASSERT] Verifica consistenza stato policy sul nodo corrente"
      ansible.builtin.assert:
        that:
          # Il nodo locale deve avere l'overlay caricato
          - local_overlay_search.results is defined and local_overlay_search.results | length > 0
          # Il nodo locale deve avere la entry cn=default
          - local_policy_search.results is defined and local_policy_search.results | length > 0
          # La policy deve avere pwdCheckQuality attivo (impostato a 0)
          - local_policy_search.results[0].pwdCheckQuality is defined
          - local_policy_search.results[0].pwdCheckQuality | int >= 1
        fail_msg: "CRITICO: Il nodo {{ inventory_hostname }} non ha la PPolicy coerente!"
        success_msg: "OK: Il nodo {{ inventory_hostname }} è configurato correttamente."
