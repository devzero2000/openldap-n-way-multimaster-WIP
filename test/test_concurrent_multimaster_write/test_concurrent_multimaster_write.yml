# ==============================================================================
# TITOLO:       test_concurrent_multimaster_write.yml
# AUTORE:       Elia Pinto
# DATA:         22 Settembre 2026
# SCOPO:        Verifica del comportamento del cluster N-Way Multi-Master
#               sotto scritture SIMULTANEE da piu' di un master, sotto WAN
#               simulata. Due scenari distinti:
#                 A) Scritture concorrenti su DN INDIPENDENTI da due master
#                    diversi - verifica che il throughput combinato converga
#                    correttamente su tutto il cluster (nessuna scrittura
#                    persa, nessun duplicato).
#                 B) Scrittura concorrente sullo STESSO DN, stesso attributo,
#                    da due master diversi, con valori diversi - verifica
#                    che la risoluzione dei conflitti (CSN, last-writer-wins)
#                    converga allo STESSO valore su tutti e 4 i nodi, senza
#                    stati divergenti persistenti (split-brain).
#
# NOTA IMPORTANTE SUL NUMERO DI SCRITTURE: e' stato scelto deliberatamente
# basso (default 200 per master, 400 combinate) - restiamo ben sotto la
# soglia di 1000 scritture per singolo provider isolata nell'indagine
# separata documentata in description_test_crash_cascading_node.md (Parte
# 3), per non confondere un problema di scrittura CONCORRENTE con quel
# problema distinto, gia' isolato a parte, di scrittura SEQUENZIALE rapida
# su un singolo provider. Se in futuro si vuole esplorare se scritture
# concorrenti abbassano ulteriormente quella soglia, e' un test a se',
# deliberato, non un effetto collaterale accidentale di questo file.
#
# LEZIONI GIA' IMPARATE (dal debug esteso di test_crash_cascading_node.yml)
# applicate qui fin dall'inizio, per non re-imparale a caro prezzo:
#   - MAI {{ item }} nel NOME di un task in loop (si renderizza prima che
#     il loop inizi).
#   - MAI un set_fact con costrutto namespace+for per produrre una lista:
#     puo' restituire una stringa invece di una lista vera, anche quando
#     un test isolato con Jinja puro sembra indicare il contrario. Loop
#     diretto su range(risultati | length) con accesso per indice.
#   - no_log sulla FONTE di un dato non impedisce a un task successivo,
#     che ci fa un loop sopra mostrando "item" per intero, di esporre
#     comunque tutto - ridurre i dati (o usare un loop per indice, come
#     sopra) PRIMA di quel loop, non dopo.
#   - Convergenza/conteggio SEMPRE via slapcat su SSH, mai ldapsearch:
#     bypassa il protocollo LDAP, il sizelimit, e soprattutto la porta
#     636 che la WAN simulata degrada apposta (SSH passa dalla 22).
#   - "0" non e' MAI un conteggio valido di fallback per una funzione di
#     conteggio - e' indistinguibile da "zero risultati genuini" e
#     falserebbe qualunque confronto con un target/attesa di convergenza
#     a zero. Sentinella "-1" per i fallimenti di connessione/comando.
#   - kill -9 diretto sul PID trovato con pgrep (con retry, blocco se
#     non esattamente un processo) - non systemctl kill.
#   - become:true su qualunque comando che tocchi file di root (slapcat,
#     status systemd, pulizia file temporanei creati da slapcat).
#   - LDAPTLS_REQCERT=never su ogni ldapadd/ldapmodify/ldapdelete verso
#     ldaps://127.0.0.1:636 (certificato locale non nella catena di
#     fiducia del client stesso).
#   - MAI "set -o pipefail" dentro un blocco "nohup sh -c '...'": fallisce
#     silenziosamente sotto dash, fermando lo script alla prima riga.
#   - Report finali con liste multi-riga: la concatenazione di liste
#     (['header'] + stdout_lines + ['footer']) deve essere l'UNICA
#     espressione Jinja del campo msg, altrimenti Jinja la stringifica
#     (letterali "\n" nel log invece di righe vere).
#   - Controllo pre-volo esplicito che i nodi da usare siano gia' sani
#     PRIMA di toccarli - un run precedente fallito puo' lasciare stato
#     residuo che altrimenti sembra un mistero diverso.
#   - Nessun nome di nodo hardcoded nella logica del playbook - sempre
#     tramite le variabili di inventory (node1/node2/node3/node4).
#
# SIMULAZIONE WAN: accesa all'inizio del "block" con
# simulate_wan_mpls_ipsec.yml (-e stato=enabled) e spenta SEMPRE nell'"always"
# (-e stato=disabled); in entrambi i casi lo stato REALE su tc/iptables dei 4
# nodi viene poi verificato con assert_wan_state.yml. Un'interruzione con
# Ctrl-C non esegue l'"always": in quel caso spegnere la WAN a mano (il run
# successivo comunque riparte pulito, perche' stato=enabled fa sempre prima il
# cleanup completo).
#
# CHECK MODE: NON usare --check: il playbook orchestra un altro
# ansible-playbook (WAN, tc/iptables) che in check mode verrebbe saltato.
#
# VERSIONE:     1.5
# CHANGELOG:
#   1.5 - 2026-10-26 - Scenario B: intervallo esplicito fra le due scritture in
#                      conflitto (conflict_write_gap_ms, 500ms: node3 scrive
#                      dopo node2) e soglia del pre-flight sugli orologi
#                      derivata da questo (meta', 250ms) invece di 50ms fissi.
#                      Il requisito reale e' scarto < intervallo fra le
#                      scritture; prima l'intervallo era solo l'overhead di
#                      Ansible e la soglia non vi era legata. Su 24.04 con
#                      systemd-timesyncd (default) lo scarto fra i nodi e' di
#                      decine di ms (misurati 43ms): innocuo, ma vicino ai 50ms.
#   1.4 - 2026-10-26 - Esito finale VERIFICATO in una nuova FASE 7, dopo il
#                      cleanup: lo Scenario A (convergenza delle 400 entry) e
#                      il cleanup di FASE 6 avevano failed_when: false e nessun
#                      assert, quindi un SCENARIO_A_TIMEOUT o residui dopo la
#                      cancellazione finivano comunque con failed=0. L'assert
#                      dello Scenario B e' spostato dalla FASE 5 alla FASE 7:
#                      prima un split-brain fermava il test PRIMA del cleanup e
#                      lasciava le 400 entry concurrent.* sul cluster (successo
#                      il 26/10). Ora il cluster viene ripulito comunque; i
#                      valori per nodo restano nei report delle fasi 3/5/6.
#   1.3 - 2026-10-26 - FASE 1: pre-flight sullo scarto degli orologi fra i 4
#                      nodi (assert_clock_skew.yml, soglia 50ms). Lo Scenario
#                      B e' fallito con un falso split-brain: VMware Tools e
#                      chrony si contendevano l'orologio delle VM (oscillazioni
#                      di ~4,5s), node3 ha generato per la sua scrittura un CSN
#                      piu' basso di quello appena ricevuto da node2 sulla
#                      stessa entry e ha tenuto il proprio valore. Ora il test
#                      si ferma prima, indicando la causa vera.
#   1.2 - 2026-10-26 - FASE 2: rimozione idempotente dei residui
#                      concurrent.a.* / concurrent.b.* di un run precedente
#                      interrotto, con attesa (polling) che la cancellazione
#                      converga a 0 su tutti e 4 i nodi PRIMA delle nuove
#                      scritture. Senza, dopo un run fallito in FASE 5 (la
#                      FASE 6 di cleanup non parte) restavano 400 entry sul
#                      cluster: al run successivo "ldapadd -c" falliva in
#                      silenzio sulle entry gia' presenti, ma il conteggio
#                      tornava comunque 400 = target - Scenario A passava
#                      senza aver scritto nulla (falso positivo).
#   1.1 - 2026-10-26 - WAN: inventory del test passato esplicitamente al
#                      playbook WAN annidato (senza "-i" usava l'inventory di
#                      default, quindi con -i su un altro ambiente la WAN
#                      veniva accesa sul cluster sbagliato senza errori);
#                      verifica dello stato REALE della WAN dopo l'accensione
#                      e dopo lo spegnimento (assert_wan_state.yml: un
#                      playbook WAN che non trova host esce con rc=0 e il
#                      test girava a velocita' LAN senza accorgersene);
#                      spegnimento WAN spostato come PRIMO task dell'"always"
#                      con failed_when: false + assert finale (un host
#                      irraggiungibile nel ldapdelete precedente interrompeva
#                      l'"always" e lasciava la WAN accesa); path dei playbook
#                      WAN ancorati a playbook_dir.
#   1.0 - 2026-09-22 - prima versione.
# ==============================================================================

---
- name: "CONCURRENT TEST 1: Scritture Concorrenti da Piu' Master sotto Carico WAN"
  hosts: localhost
  gather_facts: true
  vars:
    # Risolti dinamicamente dall'inventory (gruppi 'cluster' e
    # 'readonlyreplica'), non hardcoded - stessa convenzione di
    # test_resilienza_multimaster.yml. node1/2/3 sono i tre master in
    # ordine alfabetico, node4 e' la prima (e unica, in questo cluster)
    # replica read-only.
    node1: "{{ (groups['cluster'] | sort)[0] }}"
    node2: "{{ (groups['cluster'] | sort)[1] }}"
    node3: "{{ (groups['cluster'] | sort)[2] }}"
    node4: "{{ (groups['readonlyreplica'] | sort)[0] }}"
    ldap_basedn: "dc=example,dc=com"
    ldap_admin_dn: "cn=admin,dc=example,dc=com"
    ldap_admin_pass: "openldap"
    # Simulazione WAN: playbook dedicato + task file di verifica dello stato
    # reale. playbook_dir esplicito: il path non dipende da dove si lancia.
    wan_simulation_playbook: "{{ playbook_dir }}/../../stress_test/simulate_wan_mpls_ipsec/simulate_wan_mpls_ipsec.yml"
    wan_assert_tasks: "{{ playbook_dir }}/../../stress_test/simulate_wan_mpls_ipsec/assert_wan_state.yml"
    # Inventory del test passato esplicitamente al playbook WAN annidato:
    # senza "-i" userebbe l'inventory di default anche se questo test e'
    # stato lanciato con -i su un altro ambiente (24.04/26.04).
    wan_inventory: "{{ ansible_inventory_sources | join(',') }}"

    # Scritture per master nello Scenario A (indipendenti) - vedi nota
    # in testa al file sul perche' e' basso deliberatamente.
    writes_per_node: 200

    # Pre-flight sullo scarto degli orologi fra i nodi (assert_clock_skew.yml):
    # i CSN contengono l'orario del master che scrive, quindi con orologi
    # sfasati piu' dell'intervallo fra due scritture in conflitto l'ordine dei
    # CSN si inverte rispetto all'ordine reale e un master puo' restare
    # divergente. L'intervallo e' quindi esplicito (conflict_write_gap_ms:
    # node3 scrive almeno tanto dopo node2) e la soglia ne e' la meta': il
    # margine copre l'errore di misura e la deriva durante il test.
    # 500/250ms: sopra lo scarto normale di systemd-timesyncd (default su
    # 24.04, decine di ms fra i nodi), molto sotto lo sfasamento di secondi
    # che ha rotto il test (VMware Tools contro l'NTP).
    clock_skew_tasks: "{{ playbook_dir }}/../assert_clock_skew.yml"
    conflict_write_gap_ms: 500
    max_clock_skew_ms: "{{ (conflict_write_gap_ms | int) // 2 }}"

    conflict_test_dn: "cn=concurrent-conflict-test,ou=People,dc=example,dc=com"
    conflict_value_a: "written-by-master-a"
    conflict_value_b: "written-by-master-b"

    scenario_ab_temp_files:
      - /tmp/concurrent_a.log
      - /tmp/concurrent_a.pid
      - /tmp/concurrent_b.log
      - /tmp/concurrent_b.pid
      - /tmp/concurrent_conflict_a.log
      - /tmp/concurrent_conflict_a.pid
      - /tmp/concurrent_conflict_b.log
      - /tmp/concurrent_conflict_b.pid

  tasks:
    - name: "Blocco principale del test (disattivazione WAN garantita in 'always' anche in caso di errore in una qualunque fase)"
      block:

        # ==========================================================================
        # [PRE] ABILITAZIONE WAN SIMULATA
        # ==========================================================================

        - name: "[PRE] Abilita la simulazione WAN MPLS+IPSec su tutto il cluster (il test deve girare sotto WAN simulata, non a velocita' LAN piena)"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - -i
              - "{{ wan_inventory }}"
              - "{{ wan_simulation_playbook }}"
              - -e
              - stato=enabled
          changed_when: true

        - name: "[PRE] Verifica che la simulazione WAN sia REALMENTE attiva sui 4 nodi (rc=0 del playbook WAN non basta)"
          ansible.builtin.include_tasks: "{{ wan_assert_tasks }}"
          vars:
            wan_expected_state: "enabled"
            wan_verify_nodes: ["{{ node1 }}", "{{ node2 }}", "{{ node3 }}", "{{ node4 }}"]

        # ==========================================================================
        # FASE 1: CONTROLLO PRE-VOLO - i tre master devono essere gia' sani
        # PRIMA che questo test tocchi qualunque cosa (stesso principio gia'
        # applicato in test_crash_cascading_node.yml v7.7+)
        # ==========================================================================

        - name: "[FASE 1] Verifica pre-volo che slapd sia gia' attivo sui tre master, prima di iniziare"
          delegate_to: "{{ item }}"
          ansible.builtin.systemd:
            name: slapd
          loop:
            - "{{ node1 }}"
            - "{{ node2 }}"
            - "{{ node3 }}"
          no_log: true
          register: preflight_status
          failed_when: false

        - name: "[FASE 1] Blocca se uno dei tre master e' GIA' inattivo prima di iniziare (residuo di un run precedente, non causato da questo test)"
          ansible.builtin.assert:
            that:
              - preflight_status.results[item].status.ActiveState == "active"
            fail_msg: >-
              ERRORE: slapd su {{ preflight_status.results[item].item }} risulta
              gia' '{{ preflight_status.results[item].status.ActiveState | default('sconosciuto') }}'
              PRIMA che questo test tocchi qualunque cosa - verificare/riavviare
              slapd su tutti i nodi e ripetere da un cluster pulito.
            success_msg: "OK: slapd e' attivo su {{ preflight_status.results[item].item }} prima di iniziare."
          loop: "{{ range(preflight_status.results | length) | list }}"
          loop_control:
            label: "{{ preflight_status.results[item].item }}"

        - name: "[FASE 1] Controlla che la soglia sullo scarto degli orologi sia minore dell'intervallo fra le scritture in conflitto"
          ansible.builtin.assert:
            that:
              - (max_clock_skew_ms | int) > 0
              - (max_clock_skew_ms | int) < (conflict_write_gap_ms | int)
            fail_msg: >-
              ERRORE di configurazione del test: max_clock_skew_ms
              ({{ max_clock_skew_ms }}) deve essere > 0 e minore di
              conflict_write_gap_ms ({{ conflict_write_gap_ms }}), altrimenti
              lo Scenario B puo' dare un falso split-brain con orologi "in soglia".
            quiet: true

        - name: "[FASE 1] Verifica che gli orologi dei nodi siano allineati prima del conflitto sui CSN"
          ansible.builtin.include_tasks: "{{ clock_skew_tasks }}"
          vars:
            clock_verify_nodes: ["{{ node1 }}", "{{ node2 }}", "{{ node3 }}", "{{ node4 }}"]

        # ==========================================================================
        # FASE 2: SCENARIO A - SCRITTURE CONCORRENTI SU DN INDIPENDENTI
        # Due iniezioni in background, avviate in sequenza ravvicinata (ciascuna
        # ritorna quasi subito, il lavoro vero prosegue in nohup) - stesso
        # pattern di test_crash_cascading_node.yml FASE 1, replicato su due nodi.
        # ==========================================================================

        # Idempotenza: se un run precedente si e' fermato prima della FASE 6
        # (es. split-brain in FASE 5), le entry concurrent.* sono ancora sul
        # cluster. "ldapadd -c" salterebbe in silenzio quelle gia' presenti e
        # il conteggio di FASE 3 tornerebbe comunque al target: Scenario A
        # passerebbe senza aver scritto nulla. Si cancellano quindi i residui
        # e si attende che la cancellazione converga a 0 su TUTTI i nodi prima
        # di scrivere (altrimenti delete in replica e nuove add si
        # sovrapporrebbero).
        - name: "[FASE 2 - SCENARIO A] Rimuovi eventuali entry concurrent.* residue di un run precedente interrotto (idempotenza)"
          ansible.builtin.shell:
            cmd: |
              set -u
              set -o pipefail
              export LDAPTLS_REQCERT=never
              slapcat -b "{{ ldap_basedn }}" -a "(uid=concurrent.*)" 2>/dev/null \
                | grep "^dn:" | sed 's/^dn: //' > /tmp/concurrent_residui.txt
              DELETE_RC=0
              if [ -s /tmp/concurrent_residui.txt ]; then
                ldapdelete -x -H ldaps://127.0.0.1:636 -D "{{ ldap_admin_dn }}" -w "{{ ldap_admin_pass }}" \
                  -c -f /tmp/concurrent_residui.txt > /dev/null 2>&1
                DELETE_RC=$?
              fi
              rm -f /tmp/concurrent_residui.txt
              exit $DELETE_RC
            executable: /bin/bash
          delegate_to: "{{ node1 }}"
          become: true
          register: residual_cleanup
          changed_when: true
          failed_when: false
          no_log: true

        - name: "[FASE 2 - SCENARIO A] Blocca se la rimozione dei residui concurrent.* e' fallita"
          ansible.builtin.assert:
            that:
              - residual_cleanup.rc == 0
            fail_msg: >-
              ERRORE: rimozione dei residui concurrent.* fallita su {{ node1 }}
              (rc={{ residual_cleanup.rc }}) - output non mostrato (no_log).
              Verificare a mano con slapcat -a '(uid=concurrent.*)' e ldapdelete
              in chiaro: senza questa pulizia lo Scenario A darebbe un falso
              positivo.
            quiet: true

        - name: "[FASE 2 - SCENARIO A] Attendi che la rimozione dei residui converga a 0 su TUTTO il cluster prima di scrivere - puro shell"
          ansible.builtin.shell:
            cmd: |
              set -u
              set -o pipefail
              FILTER="(uid=concurrent.*)"
              count_on() {
                local host="$1"
                local attempt=0
                local max_attempts=3
                local result rc
                while [ $attempt -lt $max_attempts ]; do
                  attempt=$((attempt + 1))
                  result=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 "$host" \
                    "sudo slapcat -b '{{ ldap_basedn }}' -a '$FILTER' 2>/dev/null" 2>/dev/null)
                  rc=$?
                  if [ $rc -eq 0 ]; then
                    echo "$result" | grep -c "^dn: "
                    return 0
                  fi
                  sleep 0.3
                done
                echo "-1"
                return 1
              }
              START=$(date +%s)
              TIMEOUT=180
              LAST_PROGRESS_LOG=0
              while true; do
                C1=$(count_on "{{ node1 }}")
                C2=$(count_on "{{ node2 }}")
                C3=$(count_on "{{ node3 }}")
                C4=$(count_on "{{ node4 }}")
                if [ "$C1" = "0" ] && [ "$C2" = "0" ] && [ "$C3" = "0" ] && [ "$C4" = "0" ]; then
                  echo "PRECLEAN_OK: $(($(date +%s) - START))s (0 residui su tutti i 4 nodi)"
                  exit 0
                fi
                ELAPSED=$(($(date +%s) - START))
                if [ $((ELAPSED - LAST_PROGRESS_LOG)) -ge 10 ]; then
                  echo "PRECLEAN_PROGRESS: ${ELAPSED}s - residui node1=$C1 node2=$C2 node3=$C3 node4=$C4"
                  LAST_PROGRESS_LOG=$ELAPSED
                fi
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "PRECLEAN_TIMEOUT: ${TIMEOUT}s - residui node1=$C1 node2=$C2 node3=$C3 node4=$C4"
                  exit 1
                fi
                sleep 1
              done
            executable: /bin/bash
          register: preclean_convergence
          changed_when: false
          failed_when: false

        - name: "[FASE 2 - SCENARIO A] Blocca se i residui concurrent.* non sono spariti da tutti i nodi prima di scrivere"
          ansible.builtin.assert:
            that:
              - "'PRECLEAN_OK' in preclean_convergence.stdout"
            fail_msg: "{{ preclean_convergence.stdout_lines }}"
            success_msg: "{{ preclean_convergence.stdout_lines | last }}"

        - name: "[FASE 2 - SCENARIO A] Avvia scrittura asincrona in background su {{ node2 }} (namespace concurrent.a.*)"
          ansible.builtin.shell: |
            nohup sh -c '
              export LDAPTLS_REQCERT=never
              for i in $(seq 1 {{ writes_per_node }}); do
                cat << ENTRY
            dn: uid=concurrent.a.$i,ou=People,{{ ldap_basedn }}
            objectClass: top
            objectClass: inetOrgPerson
            uid: concurrent.a.$i
            cn: Concurrent Test A $i
            sn: ConcurrentTest
            userPassword: {SSHA}demoPass123!

            ENTRY
                sleep 0.005
              done | ldapadd -x -H ldaps://127.0.0.1:636 -D "{{ ldap_admin_dn }}" -w "{{ ldap_admin_pass }}" -c
            ' > /tmp/concurrent_a.log 2>&1 < /dev/null &
            echo $! > /tmp/concurrent_a.pid
          delegate_to: "{{ node2 }}"
          changed_when: true
          no_log: true

        - name: "[FASE 2 - SCENARIO A] Avvia scrittura asincrona in background su {{ node3 }} (namespace concurrent.b.*)"
          ansible.builtin.shell: |
            nohup sh -c '
              export LDAPTLS_REQCERT=never
              for i in $(seq 1 {{ writes_per_node }}); do
                cat << ENTRY
            dn: uid=concurrent.b.$i,ou=People,{{ ldap_basedn }}
            objectClass: top
            objectClass: inetOrgPerson
            uid: concurrent.b.$i
            cn: Concurrent Test B $i
            sn: ConcurrentTest
            userPassword: {SSHA}demoPass123!

            ENTRY
                sleep 0.005
              done | ldapadd -x -H ldaps://127.0.0.1:636 -D "{{ ldap_admin_dn }}" -w "{{ ldap_admin_pass }}" -c
            ' > /tmp/concurrent_b.log 2>&1 < /dev/null &
            echo $! > /tmp/concurrent_b.pid
          delegate_to: "{{ node3 }}"
          changed_when: true
          no_log: true

        - name: "[FASE 2 - SCENARIO A] Attendi il completamento della scrittura su {{ node2 }}"
          ansible.builtin.shell: |
            if [ -f /tmp/concurrent_a.pid ]; then
                PID=$(cat /tmp/concurrent_a.pid)
                while kill -0 "$PID" 2>/dev/null; do
                    sleep 1
                done
            fi
          delegate_to: "{{ node2 }}"
          changed_when: false

        - name: "[FASE 2 - SCENARIO A] Attendi il completamento della scrittura su {{ node3 }}"
          ansible.builtin.shell: |
            if [ -f /tmp/concurrent_b.pid ]; then
                PID=$(cat /tmp/concurrent_b.pid)
                while kill -0 "$PID" 2>/dev/null; do
                    sleep 1
                done
            fi
          delegate_to: "{{ node3 }}"
          changed_when: false

        # ==========================================================================
        # FASE 3: SCENARIO A - MISURAZIONE CONVERGENZA (puro shell, slapcat via
        # SSH - stesso pattern collaudato in test_crash_cascading_node.yml)
        # ==========================================================================

        - name: "[FASE 3 - SCENARIO A] Misura il tempo di convergenza delle scritture indipendenti su TUTTO il cluster - puro shell"
          ansible.builtin.shell:
            cmd: |
              set -u
              set -o pipefail
              FILTER="(uid=concurrent.*)"
              TARGET={{ (writes_per_node | int) * 2 }}
              count_on() {
                local host="$1"
                local attempt=0
                local max_attempts=3
                local result rc
                while [ $attempt -lt $max_attempts ]; do
                  attempt=$((attempt + 1))
                  result=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 "$host" \
                    "sudo slapcat -b '{{ ldap_basedn }}' -a '$FILTER' 2>/dev/null" 2>/dev/null)
                  rc=$?
                  if [ $rc -eq 0 ]; then
                    echo "$result" | grep -c "^dn: "
                    return 0
                  fi
                  sleep 0.3
                done
                echo "-1"
                return 1
              }

              START=$(date +%s)
              TIMEOUT=180
              LAST_PROGRESS_LOG=0

              while true; do
                C1=$(count_on "{{ node1 }}")
                C2=$(count_on "{{ node2 }}")
                C3=$(count_on "{{ node3 }}")
                C4=$(count_on "{{ node4 }}")
                if [ "$C1" = "$TARGET" ] && [ "$C2" = "$TARGET" ] && [ "$C3" = "$TARGET" ] && [ "$C4" = "$TARGET" ]; then
                  NOW=$(date +%s)
                  echo "SCENARIO_A_CONVERGENCE_OK: $((NOW - START))s (target=$TARGET record allineati su tutti i 4 nodi)"
                  exit 0
                fi
                NOW=$(date +%s)
                ELAPSED=$((NOW - START))
                if [ $((ELAPSED - LAST_PROGRESS_LOG)) -ge 10 ]; then
                  echo "SCENARIO_A_PROGRESS: ${ELAPSED}s - target=$TARGET node1=$C1 node2=$C2 node3=$C3 node4=$C4"
                  LAST_PROGRESS_LOG=$ELAPSED
                fi
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "SCENARIO_A_TIMEOUT: ${TIMEOUT}s - target=$TARGET node1=$C1 node2=$C2 node3=$C3 node4=$C4"
                  exit 1
                fi
                sleep 1
              done
            executable: /bin/bash
          register: scenario_a_metric
          changed_when: false
          failed_when: false
          no_log: true

        - name: "[FASE 3 - SCENARIO A] Report convergenza scritture indipendenti"
          ansible.builtin.debug:
            msg: "{{ ['========================================================================',
                      'SCENARIO A: SCRITTURE CONCORRENTI SU DN INDIPENDENTI',
                      '========================================================================']
                   + scenario_a_metric.stdout_lines +
                   ['========================================================================'] }}"

        # ==========================================================================
        # FASE 4: SCENARIO B - CONFLITTO SULLO STESSO DN/ATTRIBUTO
        # ==========================================================================

        # FIX: la FASE 6 di cleanup finale e' dentro il "block" principale, non
        # in "always" - se un run precedente e' terminato con un fallimento
        # PRIMA di arrivare alla FASE 6 (es. lo split-brain genuino rilevato in
        # FASE 5), l'entry condivisa resta sul cluster e la ldapadd successiva
        # fallisce perche' l'entry esiste gia'. Idempotenza: rimuovi
        # un'eventuale entry residua PRIMA di crearla, tollerando "non esiste".
        - name: "[FASE 4 - SCENARIO B] Rimuovi un'eventuale entry residua di un run precedente interrotto (idempotenza - tollera 'non esiste')"
          ansible.builtin.shell: |
            export LDAPTLS_REQCERT=never
            ldapdelete -x -H ldaps://127.0.0.1:636 -D "{{ ldap_admin_dn }}" -w "{{ ldap_admin_pass }}" "{{ conflict_test_dn }}"
          delegate_to: "{{ node1 }}"
          changed_when: true
          failed_when: false
          no_log: true

        - name: "[FASE 4 - SCENARIO B] Crea l'entry condivisa di test su {{ node1 }} (valore iniziale)"
          ansible.builtin.shell: |
            export LDAPTLS_REQCERT=never
            ldapadd -x -H ldaps://127.0.0.1:636 -D "{{ ldap_admin_dn }}" -w "{{ ldap_admin_pass }}" <<ENTRY
            dn: {{ conflict_test_dn }}
            objectClass: top
            objectClass: organizationalRole
            cn: concurrent-conflict-test
            description: initial-value
            ENTRY
          delegate_to: "{{ node1 }}"
          register: conflict_entry_create
          changed_when: true
          no_log: true

        - name: "[FASE 4 - SCENARIO B] Blocca se la creazione dell'entry condivisa fallisce per un motivo diverso da 'entry residua non rimossa' (gia' gestito sopra)"
          ansible.builtin.assert:
            that:
              - conflict_entry_create.rc == 0
            fail_msg: >-
              ERRORE: creazione dell'entry condivisa di conflitto fallita su
              {{ node1 }} (rc={{ conflict_entry_create.rc }}) anche dopo aver
              rimosso un'eventuale entry residua - output non mostrato
              (no_log). Verificare manualmente con ldapadd in chiaro su
              {{ node1 }} per il messaggio d'errore completo.

        - name: "[FASE 4 - SCENARIO B] Attendi che l'entry condivisa converga su node2/node3/node4 prima del conflitto - puro shell"
          ansible.builtin.shell:
            cmd: |
              set -u
              set -o pipefail
              count_on() {
                local host="$1"
                local attempt=0
                local max_attempts=3
                local result rc
                while [ $attempt -lt $max_attempts ]; do
                  attempt=$((attempt + 1))
                  result=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 "$host" \
                    "sudo slapcat -b '{{ ldap_basedn }}' -a '(cn=concurrent-conflict-test)' 2>/dev/null" 2>/dev/null)
                  rc=$?
                  if [ $rc -eq 0 ]; then
                    echo "$result" | grep -c "^dn: "
                    return 0
                  fi
                  sleep 0.3
                done
                echo "-1"
                return 1
              }
              START=$(date +%s)
              TIMEOUT=60
              while true; do
                C2=$(count_on "{{ node2 }}")
                C3=$(count_on "{{ node3 }}")
                C4=$(count_on "{{ node4 }}")
                if [ "$C2" = "1" ] && [ "$C3" = "1" ] && [ "$C4" = "1" ]; then
                  echo "CONFLICT_ENTRY_PROPAGATED: $(($(date +%s) - START))s"
                  exit 0
                fi
                ELAPSED=$(($(date +%s) - START))
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "CONFLICT_ENTRY_PROPAGATION_TIMEOUT: ${TIMEOUT}s - node2=$C2 node3=$C3 node4=$C4"
                  exit 1
                fi
                sleep 1
              done
            executable: /bin/bash
          register: conflict_entry_wait
          changed_when: false
          failed_when: false

        - name: "[FASE 4 - SCENARIO B] Blocca se l'entry condivisa non e' propagata prima del conflitto"
          ansible.builtin.assert:
            that:
              - "'CONFLICT_ENTRY_PROPAGATED' in conflict_entry_wait.stdout"
            fail_msg: "{{ conflict_entry_wait.stdout }}"

        - name: "[FASE 4 - SCENARIO B] Avvia in background la scrittura concorrente da {{ node2 }} (description={{ conflict_value_a }})"
          ansible.builtin.shell: |
            nohup sh -c '
              export LDAPTLS_REQCERT=never
              ldapmodify -x -H ldaps://127.0.0.1:636 -D "{{ ldap_admin_dn }}" -w "{{ ldap_admin_pass }}" <<ENTRY
            dn: {{ conflict_test_dn }}
            changetype: modify
            replace: description
            description: {{ conflict_value_a }}
            ENTRY
            ' > /tmp/concurrent_conflict_a.log 2>&1 < /dev/null &
            echo $! > /tmp/concurrent_conflict_a.pid
          delegate_to: "{{ node2 }}"
          changed_when: true
          no_log: true

        # node3 scrive almeno conflict_write_gap_ms dopo node2 (l'attesa parte
        # quando la scrittura di node2 e' gia' avviata): con uno scarto fra gli
        # orologi minore di questo intervallo (pre-flight di FASE 1) il CSN di
        # node3 e' sempre il piu' alto, qualunque sia l'ordine di arrivo delle
        # repliche. Senza, l'intervallo era solo l'overhead di Ansible.
        - name: "[FASE 4 - SCENARIO B] Avvia in background la scrittura concorrente da {{ node3 }} (description={{ conflict_value_b }}, dopo {{ conflict_write_gap_ms }}ms)"
          ansible.builtin.shell: |
            nohup sh -c '
              sleep {{ '%.3f' | format((conflict_write_gap_ms | int) / 1000) }}
              export LDAPTLS_REQCERT=never
              ldapmodify -x -H ldaps://127.0.0.1:636 -D "{{ ldap_admin_dn }}" -w "{{ ldap_admin_pass }}" <<ENTRY
            dn: {{ conflict_test_dn }}
            changetype: modify
            replace: description
            description: {{ conflict_value_b }}
            ENTRY
            ' > /tmp/concurrent_conflict_b.log 2>&1 < /dev/null &
            echo $! > /tmp/concurrent_conflict_b.pid
          delegate_to: "{{ node3 }}"
          changed_when: true
          no_log: true

        - name: "[FASE 4 - SCENARIO B] Attendi il completamento della modifica concorrente su {{ node2 }}"
          ansible.builtin.shell: |
            if [ -f /tmp/concurrent_conflict_a.pid ]; then
                PID=$(cat /tmp/concurrent_conflict_a.pid)
                while kill -0 "$PID" 2>/dev/null; do
                    sleep 1
                done
            fi
          delegate_to: "{{ node2 }}"
          changed_when: false

        - name: "[FASE 4 - SCENARIO B] Attendi il completamento della modifica concorrente su {{ node3 }}"
          ansible.builtin.shell: |
            if [ -f /tmp/concurrent_conflict_b.pid ]; then
                PID=$(cat /tmp/concurrent_conflict_b.pid)
                while kill -0 "$PID" 2>/dev/null; do
                    sleep 1
                done
            fi
          delegate_to: "{{ node3 }}"
          changed_when: false

        # ==========================================================================
        # FASE 5: SCENARIO B - VERIFICA DELLA RISOLUZIONE DEL CONFLITTO
        # FIX: l'attesa fissa (10s) + lettura UNA VOLTA e' stata rimossa - sotto
        # simulazione WAN (latenza/jitter/perdita attivi durante questo test,
        # vedi il cleanup "Disabilita simulazione WAN" a fine playbook) i 10s
        # non sono garantiti sufficienti, specie se un retry di syncrepl su un
        # leg degradato si inserisce nel mezzo. Si fa invece polling con lo
        # stesso pattern gia' usato in FASE 4 (propagazione pre-conflitto):
        # retry fino a convergenza o timeout, con progress log periodico.
        # ==========================================================================

        - name: "[FASE 5 - SCENARIO B] Attendi la convergenza dell'attributo in conflitto su tutti e 4 i nodi - puro shell"
          ansible.builtin.shell:
            cmd: |
              set -u
              set -o pipefail
              read_on() {
                local host="$1"
                local attempt=0
                local max_attempts=3
                local result
                while [ $attempt -lt $max_attempts ]; do
                  attempt=$((attempt + 1))
                  result=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 "$host" \
                    "sudo slapcat -b '{{ ldap_basedn }}' -a '(cn=concurrent-conflict-test)' 2>/dev/null" 2>/dev/null \
                    | grep "^description:" | sed 's/^description: //')
                  if [ -n "$result" ]; then
                    echo "$result"
                    return 0
                  fi
                  sleep 0.3
                done
                echo ""
                return 1
              }
              START=$(date +%s)
              TIMEOUT=60
              LAST_PROGRESS_LOG=0
              while true; do
                V1=$(read_on "{{ node1 }}")
                V2=$(read_on "{{ node2 }}")
                V3=$(read_on "{{ node3 }}")
                V4=$(read_on "{{ node4 }}")
                if [ "$V1" = "$V2" ] && [ "$V2" = "$V3" ] && [ "$V3" = "$V4" ] && [ -n "$V1" ]; then
                  echo "VALORE node1=$V1"
                  echo "VALORE node2=$V2"
                  echo "VALORE node3=$V3"
                  echo "VALORE node4=$V4"
                  echo "CONFLICT_RESOLUTION_CONSISTENT: tutti i nodi concordano sul valore '$V1' (dopo $(($(date +%s) - START))s)"
                  exit 0
                fi
                ELAPSED=$(($(date +%s) - START))
                if [ $((ELAPSED - LAST_PROGRESS_LOG)) -ge 10 ]; then
                  echo "CONFLICT_RESOLUTION_PROGRESS: ${ELAPSED}s - node1=$V1 node2=$V2 node3=$V3 node4=$V4"
                  LAST_PROGRESS_LOG=$ELAPSED
                fi
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "VALORE node1=$V1"
                  echo "VALORE node2=$V2"
                  echo "VALORE node3=$V3"
                  echo "VALORE node4=$V4"
                  echo "CONFLICT_RESOLUTION_SPLIT_BRAIN: i nodi NON concordano dopo ${TIMEOUT}s - vedi valori sopra"
                  exit 1
                fi
                sleep 1
              done
            executable: /bin/bash
          register: conflict_resolution
          changed_when: false
          failed_when: false

        - name: "[FASE 5 - SCENARIO B] Report risoluzione del conflitto"
          ansible.builtin.debug:
            msg: "{{ ['========================================================================',
                      'SCENARIO B: CONFLITTO SULLO STESSO DN/ATTRIBUTO',
                      '========================================================================']
                   + conflict_resolution.stdout_lines +
                   ['========================================================================'] }}"

        # ==========================================================================
        # FASE 6: CLEANUP FINALE
        # ==========================================================================

        - name: "[FASE 6] Cancellazione delle entry di test (entrambi gli scenari) su {{ node1 }}"
          ansible.builtin.shell:
            cmd: |
              set -u
              set -o pipefail
              export LDAPTLS_REQCERT=never
              slapcat -b "{{ ldap_basedn }}" -a "(|(uid=concurrent.*)(cn=concurrent-conflict-test))" 2>/dev/null \
                | grep "^dn:" | sed 's/^dn: //' > /tmp/concurrent_to_delete.txt
              ATTEMPTED=$(wc -l < /tmp/concurrent_to_delete.txt)
              DELETE_RC=0
              if [ -s /tmp/concurrent_to_delete.txt ]; then
                ldapdelete -x -H ldaps://127.0.0.1:636 -D "{{ ldap_admin_dn }}" -w "{{ ldap_admin_pass }}" \
                  -f /tmp/concurrent_to_delete.txt -c > /tmp/concurrent_cleanup_ldapdelete.log 2>&1
                DELETE_RC=$?
              fi
              if [ -f /tmp/concurrent_cleanup_ldapdelete.log ]; then
                ERRORS=$(grep -ci "error\|fail" /tmp/concurrent_cleanup_ldapdelete.log 2>/dev/null)
              else
                ERRORS=0
              fi
              echo "Tentate: $ATTEMPTED - rc ldapdelete: $DELETE_RC - righe con errori nel log: $ERRORS" > /tmp/concurrent_cleanup_summary.txt
            executable: /bin/bash
          delegate_to: "{{ node1 }}"
          become: true
          register: cleanup_objects
          changed_when: true
          no_log: true

        - name: "[FASE 6] Mostra il riepilogo della cancellazione (nessuna password qui - file separato, vedi task precedente)"
          delegate_to: "{{ node1 }}"
          ansible.builtin.command: "cat /tmp/concurrent_cleanup_summary.txt"
          register: cleanup_summary
          changed_when: false
          failed_when: false

        - name: "[FASE 6] Riepilogo cancellazione"
          ansible.builtin.debug:
            msg: "{{ cleanup_summary.stdout | default('Riepilogo non disponibile') }}"

        - name: "[FASE 6] Rimozione dei log e file temporanei su {{ node1 }}"
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          delegate_to: "{{ node1 }}"
          become: true
          loop:
            - /tmp/concurrent_to_delete.txt
            - /tmp/concurrent_cleanup_ldapdelete.log
            - /tmp/concurrent_cleanup_summary.txt

        - name: "[FASE 6] Rimozione dei file temporanei di Scenario A/B su {{ node2 }}"
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          delegate_to: "{{ node2 }}"
          become: true
          loop: "{{ scenario_ab_temp_files }}"

        - name: "[FASE 6] Rimozione dei file temporanei di Scenario A/B su {{ node3 }}"
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          delegate_to: "{{ node3 }}"
          become: true
          loop: "{{ scenario_ab_temp_files }}"

        - name: "[FASE 6] Attende (con polling reale, non un'attesa fissa) che la cancellazione converga su TUTTO il cluster - puro shell"
          ansible.builtin.shell:
            cmd: |
              set -u
              set -o pipefail
              FILTER="(|(uid=concurrent.*)(cn=concurrent-conflict-test))"
              count_on() {
                local host="$1"
                local attempt=0
                local max_attempts=3
                local result rc
                while [ $attempt -lt $max_attempts ]; do
                  attempt=$((attempt + 1))
                  result=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 "$host" \
                    "sudo slapcat -b '{{ ldap_basedn }}' -a '$FILTER' 2>/dev/null" 2>/dev/null)
                  rc=$?
                  if [ $rc -eq 0 ]; then
                    echo "$result" | grep -c "^dn: "
                    return 0
                  fi
                  sleep 0.3
                done
                echo "-1"
                return 1
              }
              START=$(date +%s)
              TIMEOUT=180
              LAST_PROGRESS_LOG=0
              while true; do
                C1=$(count_on "{{ node1 }}")
                C2=$(count_on "{{ node2 }}")
                C3=$(count_on "{{ node3 }}")
                C4=$(count_on "{{ node4 }}")
                if [ "$C1" = "0" ] && [ "$C2" = "0" ] && [ "$C3" = "0" ] && [ "$C4" = "0" ]; then
                  NOW=$(date +%s)
                  echo "CLEANUP_CONVERGENCE_OK: $((NOW - START))s (0 record residui su tutti i 4 nodi)"
                  exit 0
                fi
                NOW=$(date +%s)
                ELAPSED=$((NOW - START))
                if [ $((ELAPSED - LAST_PROGRESS_LOG)) -ge 10 ]; then
                  echo "CLEANUP_PROGRESS: ${ELAPSED}s - residui node1=$C1 node2=$C2 node3=$C3 node4=$C4"
                  LAST_PROGRESS_LOG=$ELAPSED
                fi
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "CLEANUP_CONVERGENCE_TIMEOUT: ${TIMEOUT}s - residui node1=$C1 node2=$C2 node3=$C3 node4=$C4"
                  exit 1
                fi
                sleep 1
              done
            executable: /bin/bash
          register: cleanup_convergence
          changed_when: false
          failed_when: false
          no_log: true

        - name: "[FASE 6] Report pulizia finale"
          ansible.builtin.debug:
            msg: "{{ cleanup_convergence.stdout_lines }}"

        # ==========================================================================
        # FASE 7: ESITO FINALE
        # Gli assert stanno DOPO il cleanup di FASE 6: cosi' il cluster resta
        # pulito anche quando il test fallisce (i valori per nodo restano nei
        # report delle fasi 3, 5 e 6). Fino alla v1.3 Scenario A e cleanup non
        # avevano alcun assert, e quello dello Scenario B fermava il test prima
        # del cleanup lasciando le 400 entry concurrent.* sul cluster.
        # ==========================================================================

        - name: "[FASE 7] Blocca se le scritture indipendenti dello Scenario A non sono converse su tutti i nodi"
          ansible.builtin.assert:
            that:
              - "'SCENARIO_A_CONVERGENCE_OK' in scenario_a_metric.stdout"
            fail_msg: >-
              ERRORE: le {{ (writes_per_node | int) * 2 }} entry concurrent.*
              non risultano su tutti e 4 i nodi entro il timeout - vedi le righe
              SCENARIO_A_PROGRESS/SCENARIO_A_TIMEOUT nel report di FASE 3.
              Conteggi in crescita fino alla fine = solo lento; un nodo fermo
              con entry mancanti = il buco silenzioso di replica gia' noto
              (ITS#10604), da indagare prima del test.
            success_msg: "{{ scenario_a_metric.stdout_lines | select('match', '^SCENARIO_A_CONVERGENCE_OK') | list | first | default('OK') }}"

        - name: "[FASE 7] Blocca se i nodi non concordano sul valore finale dello Scenario B (split-brain genuino, da indagare manualmente)"
          ansible.builtin.assert:
            that:
              - "'CONFLICT_RESOLUTION_CONSISTENT' in conflict_resolution.stdout"
            fail_msg: >-
              ERRORE: i quattro nodi NON concordano sul valore finale
              dell'attributo in conflitto - vedi il report di FASE 5 per i
              valori esatti su ciascun nodo. Questo e' un caso di
              inconsistenza persistente (split-brain), da indagare
              manualmente prima di considerare il cluster affidabile
              sotto scritture concorrenti sullo stesso DN. Con gli orologi
              allineati (pre-volo di FASE 1 superato) non e' un effetto dello
              sfasamento: cercare i CSN delle due modifiche nel journal di
              slapd su ogni nodo.
            success_msg: "{{ conflict_resolution.stdout_lines | last }}"

        - name: "[FASE 7] Blocca se la cancellazione delle entry di test non e' conversa a 0 su tutti i nodi"
          ansible.builtin.assert:
            that:
              - "'CLEANUP_CONVERGENCE_OK' in cleanup_convergence.stdout"
            fail_msg: >-
              ERRORE: dopo la FASE 6 restano entry di test su almeno un nodo -
              vedi le righe CLEANUP_PROGRESS e il riepilogo di ldapdelete. Il
              prossimo run le rimuove comunque in FASE 2.
            success_msg: "{{ cleanup_convergence.stdout_lines | last }}"

      always:
        # PRIMO task dell'always, e con failed_when: false: un task "always"
        # che fallisce, o un host delegato IRRAGGIUNGIBILE (non coperto da
        # failed_when, verificato su ansible-core 2.20.1), interrompe tutti
        # i task "always" successivi. Messo dopo il ldapdelete, uno
        # UNREACHABLE su node1 lasciava la WAN accesa. L'esito vero e'
        # verificato in fondo all'always (stato reale + rc).
        - name: "[POST] Disabilita la simulazione WAN su tutto il cluster (sempre, anche se il test e' fallito)"
          ansible.builtin.command:
            argv:
              - ansible-playbook
              - -i
              - "{{ wan_inventory }}"
              - "{{ wan_simulation_playbook }}"
              - -e
              - stato=disabled
          register: wan_disable
          changed_when: true
          failed_when: false

        # Rete di sicurezza oltre alla FASE 6 normale: se il test fallisce in
        # una fase PRECEDENTE alla 6 (es. lo split-brain di Scenario B
        # rilevato in FASE 5), la FASE 6 - che e' dentro il blocco principale,
        # non qui - non viene mai eseguita e l'entry condivisa di conflitto
        # resterebbe sul cluster, facendo fallire a sua volta la ldapadd del
        # prossimo run (bug gia' visto e corretto in FASE 4 con il delete
        # idempotente prima della create - questo e' lo stesso principio
        # applicato qui come seconda rete di sicurezza). "failed_when: false"
        # perche' l'entry potrebbe legittimamente non esistere (test riuscito,
        # gia' pulita dalla FASE 6 normale).
        - name: "[POST] Rimuovi SEMPRE l'entry condivisa di Scenario B (anche in caso di errore in una fase precedente alla FASE 6)"
          ansible.builtin.shell: |
            export LDAPTLS_REQCERT=never
            ldapdelete -x -H ldaps://127.0.0.1:636 -D "{{ ldap_admin_dn }}" -w "{{ ldap_admin_pass }}" "{{ conflict_test_dn }}"
          delegate_to: "{{ node1 }}"
          changed_when: true
          failed_when: false
          no_log: true

        - name: "[POST] Verifica che la simulazione WAN sia REALMENTE rimossa dai 4 nodi"
          ansible.builtin.include_tasks: "{{ wan_assert_tasks }}"
          vars:
            wan_expected_state: "disabled"
            wan_verify_nodes: ["{{ node1 }}", "{{ node2 }}", "{{ node3 }}", "{{ node4 }}"]

        - name: "[POST] Blocca se il playbook di disattivazione WAN e' terminato con errore"
          ansible.builtin.assert:
            that:
              - wan_disable.rc == 0
            fail_msg: >-
              ERRORE: simulate_wan_mpls_ipsec.yml -e stato=disabled e' uscito
              con rc={{ wan_disable.rc }} - ultime righe:
              {{ (wan_disable.stdout_lines | default([]))[-8:] | join(' | ') }}
            quiet: true
